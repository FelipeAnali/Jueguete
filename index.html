// "1 a 3" -> {1,3}; "10" -> {10,10}; "4-6" -> {4,6}
function edadCatalogo(v) {
  const nums = String(v ?? '').match(/\d+/g);
  if (!nums) return null;
  const a = +nums[0], b = +(nums[1] ?? nums[0]);
  return { edadMin: Math.min(a, b), edadMax: Math.max(a, b), edadTxt: a === b ? String(a) : `${Math.min(a, b)} a ${Math.max(a, b)}` };
}

// Texto de un grupo de edades: [1] -> "1 año"; [2,3] -> "2 y 3 años"; [5,6,7] -> "5 a 7 años"
const textoEdades = (a, b) => (a === b ? (a === 1 ? '1 año' : `${a} años`) : b === a + 1 ? `${a} y ${b} años` : `${a} a ${b} años`);

// Arma los GRUPOS DE EDAD dentro de cada rango de la app según el catálogo.
// Cada niño solo puede recibir juguetes cuya edad del catálogo incluya SU edad.
// Ejemplo con el catálogo base, rango 2 a 4: "2 y 3 años" (juguetes de 1 a 3) y "4 años" (juguetes de 4 a 6).
// Edades seguidas que tienen exactamente los mismos juguetes quedan en el mismo grupo.
function armarGruposEdad(catalogo) {
  const grupos = [];
  for (const r of CONFIG.rangos) {
    let actual = null;
    for (let e = r.min; e <= r.max; e++) {
      const sirven = catalogo.filter((t) => t.edadMin <= e && e <= t.edadMax);
      const clave = sirven.map((t) => t.codigo).sort().join(',');
      if (actual && actual.clave === clave) actual.hasta = e;
      else { actual = { rango: r, desde: e, hasta: e, clave, sirven }; grupos.push(actual); }
    }
  }
  return grupos.map((g) => ({
    ...g,
    id: `${g.rango.id}:${g.desde}-${g.hasta}`,          // así se guarda el plan de cada grupo
    label: textoEdades(g.desde, g.hasta),
    // Edades del catálogo de las que salen los juguetes del grupo (para mostrar)
    edadesCatalogo: [...new Set(g.sirven.map((t) => t.edadTxt))].join(' / '),
  }));
}

// Grupos (edad + rango) donde se usa un juguete, para mostrarlo en el catálogo
const usosDeJuguete = (t, grupos) => grupos.filter((g) => g.sirven.some((x) => x.codigo === t.codigo));

// Lee un catálogo desde Excel: busca la fila con "descripcion" y "precio".
// La columna "edad" puede venir solo en la primera fila de cada grupo (celdas combinadas): se arrastra hacia abajo.
async function leerCatalogoExcel(file) {
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  for (const nombreHoja of wb.SheetNames) {
    const filas = XLSX.utils.sheet_to_json(wb.Sheets[nombreHoja], { header: 1, raw: true, defval: null, blankrows: false });
    for (let f = 0; f < Math.min(15, filas.length); f++) {
      const enc = (filas[f] || []).map(normTxt);
      const cDesc = enc.findIndex((h) => h.startsWith('descripcion') || h === 'juguete' || h === 'nombre');
      const cPrecio = enc.findIndex((h) => h.startsWith('precio') || h.startsWith('valor'));
      if (cDesc < 0 || cPrecio < 0) continue;
      const cEdad = enc.findIndex((h) => h.startsWith('edad'));
      const cCod = enc.findIndex((h) => h.startsWith('codigo'));
      const out = [];
      const codigosVistos = new Set(); // si un código se repite en el Excel, se le agrega una letra para no confundirlos
      let edad = null;
      filas.slice(f + 1).forEach((fila, i) => {
        if (cEdad >= 0 && fila[cEdad] != null && String(fila[cEdad]).trim() !== '') edad = edadCatalogo(fila[cEdad]);
        const nombre = texto(fila[cDesc]);
        const precio = Number(String(fila[cPrecio] ?? '').replace(/[^\d.]/g, ''));
        if (!nombre || !precio) return;
        let codigo = texto(fila[cCod]) || `J${i + 1}`;
        if (codigosVistos.has(codigo)) codigo = `${codigo}-${i + 1}`;
        codigosVistos.add(codigo);
        out.push({
          codigo,
          nombre: nombre.charAt(0).toLocaleUpperCase('es') + nombre.slice(1),
          precio: Math.round(precio),
          ...(edad || { edadMin: 0, edadMax: CONFIG.edadMax, edadTxt: 'Todas' }),
        });
      });
      if (out.length) return out;
    }
  }
  throw new Error('No encontré el catálogo en ese Excel. Debe tener columnas "descripcion" y "precio" (y opcional "edad" y "codigo").');
}

// Sugerencia para un grupo de edad: reparte los niños por igual entre los juguetes que sirven para esa edad.
// Si no alcanza la plata, quita el juguete más caro y vuelve a repartir. Si ni el más barato
// alcanza para todos, dice cuántos se pueden comprar.
function sugerirMezcla(n, plata, juguetes) {
  if (!n || !juguetes.length) return { items: [], costo: 0, unidades: 0 };
  let lista = [...juguetes].sort((a, b) => a.precio - b.precio); // del más barato al más caro
  while (lista.length) {
    const k = lista.length, base = Math.floor(n / k), resto = n % k;
    const items = lista.map((t, i) => ({ codigo: t.codigo, cantidad: base + (i < resto ? 1 : 0) })).filter((x) => x.cantidad > 0);
    const costo = items.reduce((s, x) => s + x.cantidad * lista.find((t) => t.codigo === x.codigo).precio, 0);
    if (costo <= plata) return { items, costo, unidades: n };
    lista = lista.slice(0, -1);
  }
  const barato = [...juguetes].sort((a, b) => a.precio - b.precio)[0];
  const u = Math.max(0, Math.floor(plata / barato.precio));
  return { items: u ? [{ codigo: barato.codigo, cantidad: u }] : [], costo: u * barato.precio, unidades: u };
}

// Calcula todo el presupuesto por GRUPO DE EDAD (y lo suma por rango de la app):
//   - Estimado: la plata se reparte en proporción a los niños de cada grupo (igual valor por niño).
//   - Sugerencia: con esa plata, juguetes del catálogo que sirven para esa edad.
//   - Plan real: lo que ustedes escogen en cada grupo.
function calcularPresupuesto(ninosBase, compras) {
  const aUsar = Math.round((compras.total || 0) * (compras.pct ?? 100) / 100);
  const porCodigo = new Map(compras.catalogo.map((t) => [t.codigo, t]));
  const contados = ninosBase.filter((k) => k.rango && k.edad != null);
  const totalNinos = contados.length;
  const base = armarGruposEdad(compras.catalogo);
  const ninosDe = (g) => contados.filter((k) => k.rango.id === g.rango.id && k.edad >= g.desde && k.edad <= g.hasta);

  // Reparto proporcional en pesos enteros: los pesos que sobran por redondeo van a los grupos
  // con mayor fracción, para que la suma dé EXACTO la plata a usar.
  const cuentas = base.map((g) => ninosDe(g).length);
  const exactos = cuentas.map((n) => (totalNinos ? (aUsar * n) / totalNinos : 0));
  const platas = exactos.map(Math.floor);
  let resto = totalNinos ? aUsar - platas.reduce((s, x) => s + x, 0) : 0;
  exactos.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (resto > 0) { platas[i]++; resto--; } });

  const grupos = base.map((g, idx) => {
    const ks = ninosDe(g);
    const n = ks.length;
    const plata = platas[idx];
    const sugerencia = sugerirMezcla(n, plata, g.sirven);
    const filasPlan = (compras.plan[g.id] || []).map((p, i) => {
      const t = porCodigo.get(p.codigo);
      const precio = t ? t.precio : 0;
      return { i, codigo: p.codigo, juguete: t, precio, cantidad: p.cantidad || 0, subtotal: precio * (p.cantidad || 0),
        sirve: g.sirven.some((x) => x.codigo === p.codigo) }; // false si el juguete no es para esta edad
    });
    return {
      ...g, n, F: ks.filter((k) => k.g === 'F').length, M: ks.filter((k) => k.g === 'M').length,
      plata, porNino: n ? plata / n : 0, sugerencia, filasPlan,
      unidades: filasPlan.reduce((s, x) => s + x.cantidad, 0),
      costo: filasPlan.reduce((s, x) => s + x.subtotal, 0),
    };
  });

  // Totales por rango de la app (suma de sus grupos de edad)
  const suma = (gs, f) => gs.reduce((s, g) => s + f(g), 0);
  const rangos = CONFIG.rangos.map((r) => {
    const gs = grupos.filter((g) => g.rango.id === r.id);
    return {
      ...r, grupos: gs, n: suma(gs, (g) => g.n), F: suma(gs, (g) => g.F), M: suma(gs, (g) => g.M),
      plata: suma(gs, (g) => g.plata), costo: suma(gs, (g) => g.costo), unidades: suma(gs, (g) => g.unidades),
      faltan: suma(gs, (g) => Math.max(0, g.n - g.unidades)),
      sugCosto: suma(gs, (g) => g.sugerencia.costo), sugUnidades: suma(gs, (g) => g.sugerencia.unidades),
      conPlan: gs.some((g) => g.filasPlan.length),
    };
  });
  return {
    aUsar, reserva: (compras.total || 0) - aUsar, totalNinos, sinEdad: ninosBase.length - totalNinos,
    grupos, rangos, porCodigo,
    costoPlan: suma(grupos, (g) => g.costo),
    unidadesPlan: suma(grupos, (g) => g.unidades),
    // Niños sin juguete en el plan: se cuenta grupo por grupo (lo que sobra para una edad no cubre otra)
    faltanPlan: suma(grupos, (g) => Math.max(0, g.n - g.unidades)),
    // Juguetes puestos en un grupo cuya edad no corresponde (por ejemplo de un plan viejo)
    fueraDeEdad: grupos.flatMap((g) => g.filasPlan.filter((f) => !f.sirve && f.cantidad > 0).map((f) => ({ g, f }))),
    hayPlan: grupos.some((g) => g.filasPlan.length),
  };
}

// Filas para el Excel
function filasPlanCompra(P) {
  const out = [['Rango de edad', 'Edades', 'Niños del grupo', 'Código', 'Juguete', 'Edad del catálogo', 'Precio unitario', 'Cantidad', 'Subtotal']];
  for (const r of P.rangos) {
    for (const g of r.grupos) {
      for (const f of g.filasPlan) out.push([r.label, g.label, g.n, f.codigo, f.juguete?.nombre || '(no está en el catálogo)', f.juguete?.edadTxt || '', f.precio, f.cantidad, f.subtotal]);
      const dif = g.unidades - g.n;
      out.push([r.label, `Total ${g.label}`, g.n, '', `${g.unidades} juguetes ${dif < 0 ? `(faltan ${-dif})` : dif > 0 ? `(sobran ${dif})` : '(completo)'}`, '', '', g.unidades, g.costo]);
    }
    out.push([`TOTAL ${r.label}`, '', r.n, '', r.faltan ? `faltan ${r.faltan}` : 'completo', '', '', r.unidades, r.costo]);
  }
  out.push(['TOTAL PLAN', '', P.totalNinos, '', P.faltanPlan ? `faltan juguetes para ${P.faltanPlan} niños` : 'hay juguete para todos', '', '', P.unidadesPlan, P.costoPlan]);
  out.push(['Presupuesto a usar', '', '', '', '', '', '', '', P.aUsar]);
  out.push([P.aUsar - P.costoPlan >= 0 ? 'Sobra' : 'Falta', '', '', '', '', '', '', '', Math.abs(P.aUsar - P.costoPlan)]);
  return out;
}
function filasEstimado(P) {
  const out = [['Rango de edad', 'Edades', 'Juguetes del catálogo para', 'Niños', '% de los niños', 'Plata asignada', 'Valor por niño', 'Sugerencia de compra', 'Unidades sugeridas', 'Costo sugerido', 'Sobra']];
  for (const g of P.grupos) {
    out.push([g.rango.label, g.label, g.edadesCatalogo || 'Sin juguetes en el catálogo', g.n, P.totalNinos ? Math.round((g.n / P.totalNinos) * 1000) / 1000 : 0, g.plata, Math.round(g.porNino),
      g.sugerencia.items.map((x) => `${x.cantidad} x ${P.porCodigo.get(x.codigo)?.nombre}`).join(' | '),
      g.sugerencia.unidades, g.sugerencia.costo, g.plata - g.sugerencia.costo]);
  }
  const s = (f) => P.grupos.reduce((a, g) => a + f(g), 0);
  out.push(['TOTAL', '', '', P.totalNinos, 1, P.aUsar, P.totalNinos ? Math.round(P.aUsar / P.totalNinos) : 0, '',
    s((g) => g.sugerencia.unidades), s((g) => g.sugerencia.costo), s((g) => g.plata - g.sugerencia.costo)]);
  return out;
}

/* =====================================================================
   9. DATOS DE PRUEBA (solo con ?dev en la URL)
   Todo es inventado. Sirve para probar la interfaz sin datos reales:
   demo (normal), peor caso (nombres larguísimos, documentos raros,
   1.284 personas en el maestro), uno (un solo niño) y vacío.
   ===================================================================== */
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const NOMBRES_F = ['Valentina', 'Sofía', 'Isabella', 'Mariana', 'Salomé', 'Luciana', 'Antonella', 'Emilia', 'Sara', 'Gabriela'];
const NOMBRES_M = ['Mateo', 'Jacobo', 'Thiago', 'Samuel', 'Emiliano', 'Martín', 'Santiago', 'Matías', 'Juan José', 'Tomás'];
const APELLIDOS = ['Gómez', 'Restrepo', 'Valencia', 'Ospina', 'Cardona', 'Mosquera', 'Rincón', 'Arango', 'Quintero', 'Mejía', 'Caicedo', 'Hurtado'];
const SEDES_DEMO = ['SC Sede Norte', 'SC Sede Sur', 'SC Sede Centro', 'SC Sede Oriente', 'CEDI Principal', 'Sede Administrativa'];
const CARGOS_DEMO = ['Asesor de experiencia', 'Auxiliar de surtido', 'Cajero', 'Supervisor de piso', 'Auxiliar de bodega', 'Administrador de tienda'];

function generarDev(tipo) {
  if (tipo === 'vacio') return { respuestas: [], maestro: [{ ced: '1000000001', nombre: 'PERSONA DE PRUEBA', sede: 'SC Sede Norte', cargo: 'Cajero', celular: '', email: '', retiro: null }], archivos: ['(prueba) vacío'] };
  const r = rng(tipo === 'peor' ? 7 : 3);
  const pick = (a) => a[Math.floor(r() * a.length)];
  const sedes = tipo === 'peor' ? [...SEDES_DEMO, 'CC Santiago Plaza Villacolombia Cinemas y Plazoleta de Comidas Segundo Piso'] : SEDES_DEMO;
  const nMaestro = tipo === 'peor' ? 1284 : tipo === 'uno' ? 3 : 260;
  const maestro = Array.from({ length: nMaestro }, (_, i) => ({
    ced: String(1000000000 + i * 7919), nombre: `${pick(APELLIDOS)} ${pick(APELLIDOS)} ${pick([...NOMBRES_F, ...NOMBRES_M])}`.toUpperCase(),
    sede: pick(sedes), cargo: pick(CARGOS_DEMO).toUpperCase(), celular: '300' + String(1000000 + i), email: `persona${i}@correo.com`, retiro: null,
  }));
  const fecha = (a, m, d) => Date.UTC(a, m - 1, d);
  const hijo = (n, extra = {}) => {
    const f = r() < 0.5;
    return { n, nombre: `${pick(f ? NOMBRES_F : NOMBRES_M)} ${pick(APELLIDOS)} ${pick(APELLIDOS)}`, genero: f ? 'Femenino' : 'Masculino', tipo: r() < 0.6 ? 'Registro Civil' : 'Tarjeta de Identidad',
      docRaw: '', doc: String(1100000000 + Math.floor(r() * 99999999)), nacMs: fecha(2016 + Math.floor(r() * 11), 1 + Math.floor(r() * 12), 1 + Math.floor(r() * 27)), nacRaw: '', foto: 'https://ejemplo.invalid/documento.jpg', ...extra };
  };
  const respuestas = [];
  let id = 1;
  const resp = (m, hijos, extra = {}) => respuestas.push({ id: id, fin: fecha(2026, 10, 8) + id++ * 3600000, ced: m.ced, cedRaw: m.ced, nombre: nombrePropio(m.nombre), correo: 'correo@ejemplo.com', sede: m.sede, tieneHijos: hijos.length > 0, hijos, ...extra });
  if (tipo === 'uno') { resp(maestro[0], [hijo(1)]); return { respuestas, maestro, archivos: ['(prueba) uno'] }; }
  const cantidad = tipo === 'peor' ? 700 : 120;
  for (let i = 0; i < cantidad; i++) {
    const m = maestro[i];
    const nh = r() < 0.12 ? 0 : 1 + Math.floor(r() * (tipo === 'peor' ? 6 : 3));
    resp(m, Array.from({ length: nh }, (_, j) => hijo(j + 1)));
  }
  // Casos especiales que deben caer en cada listado
  const m0 = maestro[0], m1 = maestro[1], m2 = maestro[2];
  resp(m0, [hijo(1, { nacMs: fecha(2015, 11, 25) })]);                                  // reenvío con niño mayor
  resp(m1, [hijo(1, { doc: m1.ced })]);                                                   // documento igual a la cédula
  resp({ ...m2, ced: m2.ced.slice(0, -1) + '9' }, [hijo(1)]);                              // cédula mal digitada
  const comun = hijo(1);
  resp(maestro[3], [comun]); resp(maestro[4], [{ ...comun }]);                            // pareja
  if (tipo === 'peor') {
    const largo = { ...maestro[5], nombre: 'WIŚNIEWSKA-KOWALCZYK HERNÁNDEZ DE LA SANTÍSIMA TRINIDAD MARÍA DE LOS ÁNGELES', sede: sedes[sedes.length - 1], cargo: 'AUXILIAR DE PROTEINAS SENIOR Y RESPONSABLE DE INVENTARIOS DE CUARTOS FRIOS Y NEVERAS' };
    maestro[5] = largo;
    resp(largo, [
      hijo(1, { nombre: 'Jo', doc: '1234567' }),
      hijo(2, { nombre: 'Maximiliano Alejandro de Jesús Wiśniewska-Kowalczyk Hernández de la Santísima Trinidad', genero: '' }),
      hijo(3, { nacMs: null, nacRaw: '31/02/2019' }),
      hijo(4, { nombre: '', doc: '' }),
      hijo(5, { nacMs: fecha(2026, 12, 31) }),
      hijo(6),
    ]);
  }
  return { respuestas, maestro, archivos: [`(prueba) ${tipo}`] };
}

// Zona para arrastrar o escoger el Excel
function ZonaArchivo({ onArchivos, compacta, children }) {
  const [over, setOver] = useState(false);
  const input = useRef(null);
  const recibir = (lista) => { const fs = [...(lista || [])].filter((f) => /\.(xlsx|xlsm|xls)$/i.test(f.name)); if (fs.length) onArchivos(fs); };
  return (
    <div
      className={'drop' + (over ? ' over' : '')}
      style={compacta ? { minHeight: 130 } : null}
      role="button" tabIndex={0}
      onClick={() => input.current.click()}
      onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.current.click(); } }}
      onDragOver={(e) => { e.preventDefault(); setOver(true); }}
      onDragLeave={() => setOver(false)}
      onDrop={(e) => { e.preventDefault(); setOver(false); recibir(e.dataTransfer.files); }}
    >
      <Icono.doc className="drop-icon" />
      {children}
      <input ref={input} type="file" accept=".xlsx,.xlsm,.xls" multiple hidden onChange={(e) => { recibir(e.target.files); e.target.value = ''; }} />
    </div>
  );
}

// Tabla con búsqueda, orden por columna, paginación y botón de descarga
function Tabla({ filas, columnas, extra, vacio, onDescargar, filaClave, onFila, seleccion, masivo, textoExtra }) {
  const [q, setQ] = useState('');
  // masivo = { puede(fila), onAccion(filas, 'OK' | 'NO', limpiar) }: casillas para aprobar o no aprobar muchos a la vez
  const [marcadas, setMarcadas] = useState(() => new Set());
  const [orden, setOrden] = useState({ col: null, dir: 1 });
  const [limite, setLimite] = useState(CONFIG.filasPorPagina);
  const cols = columnas.filter((c) => c.ui !== false);
  useEffect(() => setLimite(CONFIG.filasPorPagina), [q, filas]);

  const filtradas = useMemo(() => {
    let r = filas;
    const nq = normTxt(q);
    if (nq) r = r.filter((f) => normTxt(columnas.map((c) => c.valor(f)).join(' ') + ' ' + (textoExtra ? textoExtra(f) : '')).includes(nq));
    if (orden.col) {
      const c = columnas.find((x) => x.id === orden.col);
      const v = c.orden || c.valor;
      r = [...r].sort((a, b) => { const x = v(a), y = v(b); return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'es', { numeric: true })) * orden.dir; });
    }
    return r;
  }, [filas, q, orden, columnas]);

  const ordenar = (id) => setOrden((o) => (o.col === id ? { col: id, dir: -o.dir } : { col: id, dir: 1 }));
  // Selección: solo filas que se pueden revisar; se limpian las que ya no están en la lista
  const elegibles = masivo ? filtradas.filter(masivo.puede) : [];
  const clavesFilas = useMemo(() => new Set(filas.map(filaClave)), [filas]);
  useEffect(() => { setMarcadas((m) => { const n = new Set([...m].filter((k) => clavesFilas.has(k))); return n.size === m.size ? m : n; }); }, [clavesFilas]);
  const todasMarcadas = elegibles.length > 0 && elegibles.every((f) => marcadas.has(filaClave(f)));
  const marcarTodas = () => setMarcadas((m) => { const n = new Set(m); elegibles.forEach((f) => (todasMarcadas ? n.delete(filaClave(f)) : n.add(filaClave(f)))); return n; });
  const marcar = (k) => setMarcadas((m) => { const n = new Set(m); n.has(k) ? n.delete(k) : n.add(k); return n; });
  const filasMarcadas = masivo ? filas.filter((f) => marcadas.has(filaClave(f))) : [];
  const limpiar = () => setMarcadas(new Set());
  if (!filas.length) return <div className="table-wrap"><div className="empty"><b>{vacio[0]}</b>{vacio[1]}</div></div>;
  return (
    <div>
      <div className="table-tools">
        <input className="search" type="search" placeholder="Buscar por nombre, cédula, documento o sede" value={q} onChange={(e) => setQ(e.target.value)} aria-label="Buscar en la tabla" />
        <span className="table-meta">{q ? `${fmtNum(filtradas.length)} de ${fmtNum(filas.length)}` : plural(filas.length, 'fila', 'filas')}</span>
        {onDescargar && <button className="btn btn-ghost btn-sm" style={{ marginLeft: 'auto' }} onClick={onDescargar}>Descargar este listado</button>}
      </div>
      {masivo && elegibles.length > 0 && (
        <div className={'bulkbar' + (filasMarcadas.length ? ' activa' : '')} role="region" aria-label="Revisar varios a la vez">
          {filasMarcadas.length ? <>
            <b>{plural(filasMarcadas.length, 'seleccionado', 'seleccionados')}</b>
            <button className="btn btn-sm btn-ok" onClick={() => masivo.onAccion(filasMarcadas, 'OK', limpiar)}>Aprobar seleccionados</button>
            <button className="btn btn-sm btn-bad" onClick={() => masivo.onAccion(filasMarcadas, 'NO', limpiar)}>No aprobar seleccionados</button>
            <button className="btn-link" onClick={limpiar}>Quitar selección</button>
          </> : <span>Marca las casillas para aprobar o no aprobar varios a la vez. Tip: busca un motivo (por ejemplo “dígitos”) y marca todos.</span>}
        </div>
      )}
      <div className="table-wrap">
        <table>
          <thead><tr>
            {masivo && <th className="sel"><input type="checkbox" checked={todasMarcadas} disabled={!elegibles.length} onChange={marcarTodas} aria-label={todasMarcadas ? 'Quitar todos' : `Marcar todos (${elegibles.length})`} title={todasMarcadas ? 'Quitar todos' : `Marcar los ${elegibles.length} de la lista`} /></th>}
            {cols.map((c) => (
              <th key={c.id} className={c.num ? 'num' : ''} aria-sort={orden.col === c.id ? (orden.dir > 0 ? 'ascending' : 'descending') : 'none'}>
                <button onClick={() => ordenar(c.id)}>{c.label}<span className="arrow">{orden.col === c.id ? (orden.dir > 0 ? '▲' : '▼') : ''}</span></button>
              </th>
            ))}
            {extra && extra.map((e) => <th key={e.id}>{e.label}</th>)}
          </tr></thead>
          <tbody>
            {filtradas.slice(0, limite).map((f) => {
              const k = filaClave(f);
              return (
                <tr key={k} className={(onFila ? 'clickable ' : '') + (seleccion === k || marcadas.has(k) ? 'is-selected' : '')} onClick={onFila ? () => onFila(f) : undefined}>
                  {masivo && <td className="sel">{masivo.puede(f) && <input type="checkbox" checked={marcadas.has(k)} onChange={() => marcar(k)} onClick={(e) => e.stopPropagation()} aria-label={`Seleccionar ${k}`} />}</td>}
                  {cols.map((c) => (
                    <td key={c.id} className={[c.num && 'num', c.wrap && 'wrap', c.mono && 'mono nowrap'].filter(Boolean).join(' ')}>
                      {c.render ? c.render(f) : c.valor(f)}
                    </td>
                  ))}
                  {extra && extra.map((e) => <td key={e.id} className={e.className || ''}>{e.render(f)}</td>)}
                </tr>
              );
            })}
          </tbody>
        </table>
        {!filtradas.length && <div className="empty"><b>Sin resultados</b>Nada coincide con “{q}”.</div>}
      </div>
      {filtradas.length > limite && (
        <div className="more"><button className="btn" onClick={() => setLimite((l) => l + CONFIG.filasPorPagina)}>
          Mostrar {fmtNum(Math.min(CONFIG.filasPorPagina, filtradas.length - limite))} más (quedan {fmtNum(filtradas.length - limite)})
        </button></div>
      )}
    </div>
  );
}

// Columna "Revisión" con los botones Aprobar / No aprobar
function CeldaDecision({ k, onDecidir }) {
  if (k.duplicadoDe) return <span className="pill pill-muted" title="Ya está inscrito: no necesita revisión">Repetido</span>;
  if (k.decision) {
    const ok = k.decision.d === 'OK';
    return (
      <div className="decision">
        <span className={'pill ' + (ok ? 'pill-ok' : 'pill-bad')}>{ok ? 'Aprobado' : 'No aprobado'}</span>
        {k.reasignadoDe && <small>A nombre de CC {k.ced}</small>}
        <small>{k.decision.motivo ? `“${k.decision.motivo}” ` : ''}{k.decision.por ? `por ${k.decision.por}` : ''}</small>
        <button className="btn-link" style={{ alignSelf: 'flex-start' }} onClick={(e) => { e.stopPropagation(); onDecidir(k, null); }}>Cambiar</button>
      </div>
    );
  }
  return (
    <div className="decision"><div className="row">
      <button className="btn btn-sm btn-ok" onClick={(e) => { e.stopPropagation(); onDecidir(k, 'OK'); }}>Aprobar</button>
      <button className="btn btn-sm btn-bad" onClick={(e) => { e.stopPropagation(); onDecidir(k, 'NO'); }}>No aprobar</button>
    </div></div>
  );
}

// Escalera de edades: 0 a 10 años apilado por género, con los rangos debajo
function EscaleraEdades({ porEdad, porRango, corte }) {
  const max = Math.max(1, ...porEdad.map(totalG));
  return (
    <figure className="ladder">
      <div className="ladder-cols" role="img" aria-label={'Niños por edad: ' + porEdad.map((v, e) => `${e} años ${totalG(v)}`).join(', ')}>
        {porEdad.map((v, e) => {
          const t = totalG(v);
          return (
            <div className="ladder-col" key={e} title={`${e} ${e === 1 ? 'año' : 'años'}: ${t} (F ${v.F}, M ${v.M}${v.O ? `, sin género ${v.O}` : ''})`}>
              <span className="ladder-total">{fmtNum(t)}</span>
              <div className="ladder-bar" style={{ height: `${(t / max) * 82}%` }}>
                <i className="seg-m" style={{ flexGrow: v.M }} />
                <i className="seg-f" style={{ flexGrow: v.F }} />
                <i className="seg-o" style={{ flexGrow: v.O }} />
              </div>
            </div>
          );
        })}
      </div>
      <div className="ladder-axis" />
      <div className="ladder-cols" style={{ height: 'auto' }}>
        {porEdad.map((_, e) => <div className="ladder-col" key={e}><span className="ladder-age">{e}</span></div>)}
      </div>
      <div className="ladder-bands">
        {CONFIG.rangos.map((r) => {
          const v = porRango[r.id];
          return (
            <div className="band" key={r.id} style={{ gridColumn: `${r.min + 1} / ${r.max + 2}` }}>
              <b>{fmtNum(totalG(v))}</b>
              <span>{r.label}</span>
              <small>F {fmtNum(v.F)} · M {fmtNum(v.M)}{v.O ? ` · sin género ${fmtNum(v.O)}` : ''}</small>
            </div>
          );
        })}
      </div>
      <figcaption>Edad cumplida al {fmtFechaLarga(corte)}. Solo niños aprobados.</figcaption>
    </figure>
  );
}

/* =====================================================================
   11. APLICACIÓN PRINCIPAL
   ===================================================================== */
const VISTAS = [
  { id: 'resumen', label: 'Resumen', color: 'var(--tint)' },
  { id: 'aprobados', label: 'Aprobados', color: 'var(--ok)' },
  { id: 'revisar', label: 'Por revisar', color: 'var(--warn)' },
  { id: 'retirados', label: 'No están en el maestro', color: 'var(--warn)' },
  { id: 'rechazados', label: 'Rechazados', color: 'var(--bad)' },
  { id: 'sin', label: 'Sin inscribir', color: 'var(--muted)' },
  { id: 'presupuesto', label: 'Presupuesto y compra', color: 'var(--lime)' },
  { id: 'descargas', label: 'Descargas', color: 'var(--tint)' },
];

function leerLocal(k, def) { try { return localStorage.getItem(k) ?? def; } catch (e) { return def; } }
function guardarLocal(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }

function App() {
  const devMode = useMemo(() => new URLSearchParams(location.search).has('dev'), []);
  const [datos, setDatos] = useState(null);               // lo que se leyó de los Excel
  const [fuenteDev, setFuenteDev] = useState('real');     // solo modo pruebas
  const [fechaEntrega, setFechaEntrega] = useState(CONFIG.fechaEntregaPorDefecto);
  const [sede, setSede] = useState('');                   // '' = todas las sedes
  const [vista, setVista] = useState('resumen');
  const [decisiones, setDecisiones] = useState({});       // revisiones (se guardan solas en este equipo y en la copia de GitHub)
  const [sinGuardar, setSinGuardar] = useState(0);        // cuántas revisiones no se han descargado
  const [modal, setModal] = useState(null);
  const [toast, setToast] = useState('');
  const [ocupado, setOcupado] = useState('');
  const [error, setError] = useState('');
  const [revisor, setRevisor] = useState(() => leerLocal('regalos2026.revisor', '')); // solo el nombre de quien revisa
  // Presupuesto, catálogo y plan de compra. No tiene datos personales, así que se guarda en el navegador.
  const [compras, setCompras] = useState(() => {
    try { const g = JSON.parse(leerLocal('regalos2026.compras', '')); if (g && g.catalogo) return { ...comprasIniciales(), ...g }; } catch (e) { /* nada guardado */ }
    return comprasIniciales();
  });
  const cambiarCompras = (cambio) => setCompras((c) => ({ ...c, ...(typeof cambio === 'function' ? cambio(c) : cambio), fecha: new Date().toISOString() }));
  useEffect(() => { guardarLocal('regalos2026.compras', JSON.stringify(compras)); }, [compras]);
  const logo = useRef(null);
  const inputJson = useRef(null);

  // ---------- Guardado en este equipo (IndexedDB)
  const [cargadoLocal, setCargadoLocal] = useState(false); // no se guarda nada hasta terminar de leer lo guardado
  const [guardadoLocal, setGuardadoLocal] = useState('');   // fecha del último guardado aquí, o 'error'
  const aplicarEstado = (e) => {
    if (e.datos !== undefined) setDatos(e.datos);
    if (e.decisiones) setDecisiones(e.decisiones);
    if (e.compras && e.compras.catalogo) setCompras({ ...comprasIniciales(), ...e.compras });
    if (e.fechaEntrega) setFechaEntrega(e.fechaEntrega);
  };
  useEffect(() => {
    pedirAlmacenamientoPersistente();
    idbLeer('estado').then((g) => {
      if (g) aplicarEstado({ datos: g.datos || null, decisiones: g.decisiones || {}, compras: g.compras, fechaEntrega: g.fechaEntrega });
      setCargadoLocal(true);
    });
  }, []);
  useEffect(() => {
    if (!cargadoLocal) return;
    const t = setTimeout(() => {
      idbGuardar('estado', { datos, decisiones, compras, fechaEntrega, guardado: new Date().toISOString() })
        .then(() => setGuardadoLocal(new Date().toISOString()))
        .catch(() => setGuardadoLocal('error'));
    }, 400);
    return () => clearTimeout(t);
  }, [cargadoLocal, datos, decisiones, compras, fechaEntrega]);

  // ---------- Copia en GitHub
  const [gh, setGh] = useState(() => { try { return { ...GH_POR_DEFECTO, ...JSON.parse(leerLocal('regalos2026.github', '{}')) }; } catch (e) { return { ...GH_POR_DEFECTO }; } });
  const [claveNube, setClaveNube] = useState(() => (gh.recordarClave ? gh.clave || '' : ''));
  const [nube, setNube] = useState({ estado: 'off', fecha: '', msg: '' }); // off | falta-clave | pendiente | subiendo | ok | error
  const nubeActiva = !!(gh.token && gh.repo && claveNube);
  const shaNube = useRef(null);       // versión de la copia que ya conocemos
  const ultimoSubido = useRef('');    // contenido (sin cifrar) que ya está igual en GitHub
  const estadoRef = useRef({});
  estadoRef.current = { datos, decisiones, compras, fechaEntrega };
  const textoEstado = (e) => JSON.stringify([e.datos || null, e.decisiones || {}, e.compras || null, e.fechaEntrega || null]);
  const enCurso = useRef(false);

  // Trae la copia de GitHub y la junta con lo de aquí. Devuelve el estado juntado.
  const bajarNube = async (cfg = gh, clave = claveNube) => {
    const remota = await ghLeer(cfg);
    if (!remota) { shaNube.current = null; return { estado: estadoRef.current, existe: false }; }
    const abierto = await abrirJsonRevisiones(remota.texto, clave);
    const junto = fusionarEstado(estadoRef.current, abierto);
    shaNube.current = remota.sha;
    if (textoEstado(junto) !== textoEstado(estadoRef.current)) { estadoRef.current = junto; aplicarEstado(junto); }
    // Si lo de aquí no trae nada nuevo, no hace falta volver a subir
    const remotoNorm = { datos: abierto.datos, decisiones: abierto.decisiones, compras: abierto.compras && abierto.compras.catalogo ? { ...comprasIniciales(), ...abierto.compras } : null, fechaEntrega: abierto.fechaEntrega };
    if (textoEstado(junto) === textoEstado(remotoNorm)) ultimoSubido.current = textoEstado(junto);
    return { estado: junto, existe: true };
  };
  const subirNube = async (forzar = false) => {
    if (!nubeActiva || enCurso.current) return;
    if (!estadoRef.current.datos && !Object.keys(estadoRef.current.decisiones || {}).length) return; // nada que respaldar todavía
    if (!forzar && textoEstado(estadoRef.current) === ultimoSubido.current) { setNube((n) => ({ ...n, estado: 'ok' })); return; }
    enCurso.current = true;
    setNube((n) => ({ ...n, estado: 'subiendo', msg: '' }));
    try {
      for (let intento = 0; intento < 3; intento++) {
        const { estado: e } = await bajarNube(); // primero se juntan los cambios de los demás
        if (!forzar && textoEstado(e) === ultimoSubido.current) { setNube({ estado: 'ok', fecha: new Date().toISOString(), msg: '' }); break; }
        const txt = await armarJsonRevisiones(e.decisiones, claveNube, revisor, e.compras, { datos: e.datos, fechaEntrega: e.fechaEntrega });
        try {
          shaNube.current = await ghEscribir(gh, txt, shaNube.current);
          ultimoSubido.current = textoEstado(e);
          setNube({ estado: 'ok', fecha: new Date().toISOString(), msg: '' });
          break;
        } catch (err) {
          if ((err.status === 409 || err.status === 422) && intento < 2) continue; // otra persona subió justo antes: se vuelve a juntar
          throw err;
        }
      }
    } catch (err) {
      setNube((n) => ({ ...n, estado: 'error', msg: err.message || String(err) }));
    }
    enCurso.current = false;
  };
  // Al abrir la página (o al conectar): trae la copia de GitHub
  useEffect(() => {
    if (!cargadoLocal) return;
    if (!gh.token) { setNube({ estado: 'off', fecha: '', msg: '' }); return; }
    if (!claveNube) { setNube({ estado: 'falta-clave', fecha: '', msg: '' }); return; }
    enCurso.current = true;
    setNube((n) => ({ ...n, estado: 'subiendo', msg: '' }));
    bajarNube().then(({ existe }) => {
      setNube({ estado: 'ok', fecha: existe ? new Date().toISOString() : '', msg: '' });
    })
      .catch((err) => setNube({ estado: 'error', fecha: '', msg: err.message || String(err) }))
      .finally(() => { enCurso.current = false; });
  }, [cargadoLocal, gh.token, gh.repo, gh.rama, gh.ruta, claveNube]);
  // Sube la copia unos segundos después de cada cambio
  useEffect(() => {
    if (!cargadoLocal || !nubeActiva) return;
    if (textoEstado(estadoRef.current) === ultimoSubido.current) return;
    setNube((n) => (n.estado === 'error' || n.estado === 'subiendo' ? n : { ...n, estado: 'pendiente' }));
    const t = setTimeout(() => subirNube(), 6000);
    return () => clearTimeout(t);
  }, [cargadoLocal, nubeActiva, datos, decisiones, compras, fechaEntrega, nube.estado === 'ok']);
  // Revisa cada 2 minutos si otra persona subió cambios
  useEffect(() => {
    if (!nubeActiva) return;
    const t = setInterval(() => { if (!enCurso.current && document.visibilityState === 'visible') bajarNube().catch(() => {}); }, 120000);
    return () => clearInterval(t);
  }, [nubeActiva, gh, claveNube]);
  const guardarConfigGh = (cfg, clave) => {
    const g = { ...cfg, clave: cfg.recordarClave ? clave : '' };
    guardarLocal('regalos2026.github', JSON.stringify(g));
    shaNube.current = null; ultimoSubido.current = '';
    setGh(g); setClaveNube(clave); setModal(null);
    setToast('Copia en GitHub conectada');
  };
  // Para abrir en otro computador: la copia cifrada del repo se lee sin token, solo con la clave
  const [copiaPublica, setCopiaPublica] = useState(null);
  useEffect(() => { if (!nubeActiva) leerCopiaPublica(gh).then(setCopiaPublica); }, [nubeActiva]);
  const abrirConClave = async (clave) => {
    const abierto = await abrirJsonRevisiones(copiaPublica, clave); // si la clave es mala, lanza error
    const junto = fusionarEstado(estadoRef.current, abierto);
    estadoRef.current = junto; aplicarEstado(junto);
    await idbGuardar('estado', { ...junto, guardado: new Date().toISOString() }).catch(() => {}); // queda guardado aquí de una vez
    const g = { ...gh, recordarClave: true, clave };
    guardarLocal('regalos2026.github', JSON.stringify(g));
    setGh(g); setClaveNube(clave);
    setToast('Listo: se trajo lo guardado del equipo');
  };
  const desconectarGh = () => { const g = { ...gh, token: '', clave: '' }; guardarLocal('regalos2026.github', JSON.stringify(g)); setGh(g); setClaveNube(''); setModal(null); setToast('GitHub desconectado en este equipo'); };
  const borrarEsteEquipo = async () => {
    if (!confirm('¿Borrar de este equipo el Excel, las revisiones y la conexión a GitHub? La copia que está en GitHub NO se borra.')) return;
    await idbBorrar('estado');
    try { localStorage.removeItem('regalos2026.compras'); localStorage.removeItem('regalos2026.github'); } catch (e) { /* nada */ }
    location.reload();
  };
  const pendienteNube = nubeActiva && (nube.estado === 'pendiente' || nube.estado === 'subiendo');

  useEffect(() => { cargarLogo().then((l) => { logo.current = l; }); }, []);
  useEffect(() => { if (toast) { const t = setTimeout(() => setToast(''), 3200); return () => clearTimeout(t); } }, [toast]);
  // Aviso al cerrar la pestaña si la copia de GitHub todavía no se ha subido
  useEffect(() => {
    const h = (e) => { if (pendienteNube) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', h);
    return () => window.removeEventListener('beforeunload', h);
  }, [pendienteNube]);

  const datosActivos = useMemo(() => (fuenteDev === 'real' ? datos : generarDev(fuenteDev)), [fuenteDev, datos]);
  const listo = datosActivos && datosActivos.respuestas && datosActivos.maestro;
  const modelo = useMemo(() => (listo ? procesar(datosActivos, decisiones, fechaEntrega) : null), [listo, datosActivos, decisiones, fechaEntrega]);
  useEffect(() => { if (modelo && sede && !modelo.sedes.includes(sede)) setSede(''); }, [modelo, sede]);

  // Listas filtradas por la sede escogida
  const L = useMemo(() => {
    if (!modelo) return null;
    const enSede = (x) => !sede || x.sede === sede;
    const ninos = modelo.ninos.filter(enSede);
    const por = (est) => ninos.filter((k) => k.estado === est);
    const aprobados = por('aprobado');
    const revisar = por('revisar');
    // Los casos ya decididos siguen visibles en su listado original para poder cambiarlos
    const revisados = ninos.filter((k) => k.decision);
    const retirados = ninos.filter((k) => k.estadoBase === 'retirado');
    const rechazados = ninos.filter((k) => k.estado === 'rechazado' || (k.estadoBase === 'rechazado' && k.decision));
    const sin = modelo.sinInscribir.filter(enSede);
    const activos = modelo.maestroActivo.filter(enSede);
    const respondieron = activos.filter((m) => modelo.colaboradores.has(m.ced)).length;
    const colabAprob = new Set(aprobados.map((k) => k.ced)).size;
    const retiradosColab = new Set(retirados.map((k) => k.ced)).size;
    return {
      ninos, aprobados, revisar, revisados, retirados, rechazados, sin, activos, respondieron, colabAprob, retiradosColab,
      revisarTodo: ninos.filter((k) => k.estadoBase === 'revisar'),
      pendientes: ninos.filter((k) => !k.decision && (k.estadoBase === 'revisar' || k.estadoBase === 'retirado')).length,
      ...contar(aprobados),
    };
  }, [modelo, sede]);

  // ---------- Cargar Excel
  const cargarExcel = async (files) => {
    setError(''); setOcupado('Leyendo el Excel…');
    try {
      const nuevo = await leerArchivos(files);
      if (!nuevo.respuestas && !nuevo.maestro) throw new Error('No encontré ni las respuestas del Forms ni el maestro en ese archivo. Revisa que tenga la hoja de respuestas (con “Numero de Documento” y columnas “(Hijo 1)”) y la hoja del maestro (con “Empleado” y “Nombre del empleado”).');
      setDatos((prev) => {
        const fecha = new Date().toISOString(); // para saber cuál Excel es el más reciente al juntar copias
        if (nuevo.respuestas && nuevo.maestro) return { ...nuevo, fecha };
        // Si solo trae una parte, se completa con lo que ya estaba cargado
        return { respuestas: nuevo.respuestas || prev?.respuestas || null, maestro: nuevo.maestro || prev?.maestro || null, archivos: [...(prev?.archivos || []), ...nuevo.archivos], fecha };
      });
      setFuenteDev('real');
      setToast(`Leído: ${files.map((f) => f.name).join(', ')}`);
    } catch (e) { setError(e.message || String(e)); }
    setOcupado('');
  };

  // ---------- Actualizar solo el maestro de personal
  // modo 'agregar': suma las personas nuevas y actualiza las que ya estaban (por cédula); nadie se borra.
  // modo 'reemplazar': el maestro nuevo reemplaza al anterior completo.
  const cargarMaestro = async (files, modo) => {
    setError(''); setOcupado('Leyendo el maestro…');
    try {
      const nuevo = await leerArchivos(files);
      if (!nuevo.maestro || !nuevo.maestro.length) throw new Error('No encontré el maestro de personal en ese archivo. Debe tener una columna con la cédula ("Empleado" o "Cédula") y otra con el nombre ("Nombre del empleado" o "Nombre").');
      const antes = datos?.maestro || [];
      const porCed = new Map(antes.map((m) => [m.ced, m]));
      let nuevas = 0, actualizadas = 0;
      for (const m of nuevo.maestro) { if (!porCed.has(m.ced)) nuevas++; else if (JSON.stringify(porCed.get(m.ced)) !== JSON.stringify(m)) actualizadas++; }
      let maestro;
      if (modo === 'reemplazar') maestro = nuevo.maestro;
      else { nuevo.maestro.forEach((m) => porCed.set(m.ced, m)); maestro = [...porCed.values()]; }
      const nuevosDatos = { respuestas: datos?.respuestas || null, maestro, archivos: [...(datos?.archivos || []).filter((a) => !nuevo.archivos.includes(a)), ...nuevo.archivos], fecha: new Date().toISOString() };
      // Cuántos niños que "no estaban en el maestro" ahora sí están
      const fuera = (d) => (d.respuestas && d.maestro ? procesar(d, decisiones, fechaEntrega).ninos.filter((k) => k.estadoBase === 'retirado').length : null);
      const fueraAntes = datos ? fuera(datos) : null, fueraDespues = fuera(nuevosDatos);
      setDatos(nuevosDatos); setFuenteDev('real');
      setModal({ tipo: 'maestro-ok', resumen: { modo, total: maestro.length, activos: maestro.filter((m) => m.retiro == null).length, nuevas, actualizadas, quitadas: modo === 'reemplazar' ? antes.filter((m) => !nuevo.maestro.some((x) => x.ced === m.ced)).length : 0, fueraAntes, fueraDespues } });
    } catch (e) { setError(e.message || String(e)); setModal(null); }
    setOcupado('');
  };

  // ---------- Revisiones
  const pedirDecision = (k, d) => setModal({ tipo: 'decision', k, d });
  const guardarDecision = (k, d, motivo, por, asignarA = '') => {
    setRevisor(por); guardarLocal('regalos2026.revisor', por);
    setDecisiones((prev) => ({ ...prev, [k.key]: { d, motivo: motivo.trim(), por: por.trim(), fecha: new Date().toISOString(), nino: k.nino, ced: k.key.split('|')[0], doc: k.doc, asignarA: d === 'OK' ? asignarA : '' } }));
    setSinGuardar((n) => n + 1);
    setModal(null);
    setToast(d === 'OK' ? `${k.nino || 'Niño'} quedó aprobado` : d === 'NO' ? `${k.nino || 'Niño'} quedó como no aprobado` : 'Revisión quitada');
  };
  const pedirDecisionMasiva = (ks, d, limpiar) => setModal({ tipo: 'decision-masiva', ks, d, limpiar });
  const guardarDecisionMasiva = (ks, d, motivo, por, limpiar) => {
    setRevisor(por); guardarLocal('regalos2026.revisor', por);
    const fecha = new Date().toISOString();
    setDecisiones((prev) => {
      const out = { ...prev };
      for (const k of ks) out[k.key] = { d, motivo: motivo.trim(), por: por.trim(), fecha, nino: k.nino, ced: k.key.split('|')[0], doc: k.doc, asignarA: '' };
      return out;
    });
    setModal(null); limpiar && limpiar();
    setToast(`${plural(ks.length, 'niño', 'niños')} ${d === 'OK' ? (ks.length === 1 ? 'quedó aprobado' : 'quedaron aprobados') : (ks.length === 1 ? 'quedó como no aprobado' : 'quedaron como no aprobados')}`);
  };
  const masivo = { puede: (k) => !k.duplicadoDe, onAccion: pedirDecisionMasiva };
  const textoMotivos = (k) => [...(k.revisar || []), ...(k.sugerencias || []), k.rechazo || ''].join(' ');
  const totalRevisiones = Object.values(decisiones).filter((d) => d && d.d).length;

  const abrirJson = async (files, clave) => {
    for (const f of files) {
      const txt = await f.text();
      try {
        const abierto = await abrirJsonRevisiones(txt, clave);
        setDecisiones((prev) => fusionarDecisiones(prev, abierto.decisiones).decisiones);
        // El plan de compra del archivo se usa solo si es más reciente que el que ya hay aquí
        let trajoPlan = false;
        if (abierto.compras && abierto.compras.catalogo) {
          setCompras((c) => {
            if ((abierto.compras.fecha || '') > (c.fecha || '')) { trajoPlan = true; return { ...comprasIniciales(), ...abierto.compras }; }
            return c;
          });
        }
        setModal(null);
        setToast(`Cargado ${f.name}${trajoPlan ? ' (incluye el plan de compra)' : ''}`);
      } catch (e) {
        if (e.necesitaClave) { setModal({ tipo: 'clave-abrir', files: [f], mala: !!e.claveMala }); return; }
        setError(e.message);
      }
    }
  };
  const descargarJson = async (clave) => {
    setOcupado('Preparando el archivo…');
    try {
      const txt = await armarJsonRevisiones(decisiones, clave, revisor, compras);
      descargarBytes(new TextEncoder().encode(txt), `revisiones_regalos_${CONFIG.anio}_${hoyIso()}.json`, 'application/json');
      setSinGuardar(0); setModal(null);
      setToast(clave ? 'Revisiones descargadas con clave' : 'Revisiones descargadas');
    } catch (e) { setError(e.message); }
    setOcupado('');
  };

  // ---------- Presupuesto (siempre con TODAS las sedes: la compra es una sola)
  const ninosPresupuesto = useMemo(() => (modelo ? modelo.ninos.filter((k) => k.estado === 'aprobado'
    || (compras.incluirPendientes && !k.decision && (k.estadoBase === 'revisar' || k.estadoBase === 'retirado'))) : []), [modelo, compras.incluirPendientes]);
  const P = useMemo(() => calcularPresupuesto(ninosPresupuesto, compras), [ninosPresupuesto, compras]);
  const descargarPedido = async () => {
    setOcupado('Llenando el formato de Toy Park…');
    try {
      const { bytes, items, usoPlan } = await llenarFormatoPedido(P);
      descargarBytes(bytes, `FP_Pedido_TPS_${CONFIG.anio}_Canaveral_${hoyIso()}.xlsx`, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      setToast(`Formato listo: ${plural(items.length, 'juguete', 'juguetes')}, ${fmtNum(items.reduce((a, x) => a + x.cantidad, 0))} unidades${usoPlan ? '' : ' (con la sugerencia)'}`);
    } catch (e) { setError(e.message || String(e)); }
    setOcupado('');
  };

  // ---------- Descargas
  const nombreSede = sede || 'Todas las sedes';
  const hojasDisponibles = L ? [
    { id: 'aprobados', nombre: 'Aprobados', desc: 'Los niños que reciben regalo', n: L.aprobados.length, ws: () => hojaDesde(L.aprobados, COLS_APROBADOS) },
    { id: 'revisar', nombre: 'Por revisar', desc: 'Casos raros, incluye los ya revisados', n: L.revisarTodo.length, ws: () => hojaDesde(L.revisarTodo, COLS_REVISAR) },
    { id: 'retirados', nombre: 'No estan en el maestro', desc: 'Retirados o cédula mal digitada', n: L.retirados.length, ws: () => hojaDesde(L.retirados, COLS_RETIRADOS) },
    { id: 'rechazados', nombre: 'Rechazados', desc: 'Con el motivo de cada uno', n: L.rechazados.length, ws: () => hojaDesde(L.rechazados, COLS_RECHAZADOS) },
    { id: 'sin', nombre: 'Sin inscribir', desc: 'Colaboradores activos que no han respondido', n: L.sin.length, ws: () => hojaDesde(L.sin, COLS_SIN) },
    { id: 'compras', nombre: 'Compras por rango', desc: 'Sede, rango de edad y género', n: null, ws: () => hojaTabla(filasCompras(L.aprobados, modelo.sedes.filter((s) => !sede || s === sede))) },
    { id: 'edad', nombre: 'Por edad', desc: 'De 0 a 10 años, por género', n: null, ws: () => hojaTabla(filasPorEdad(L.aprobados)) },
    { id: 'sedes', nombre: 'Resumen por sede', desc: 'Cobertura del maestro y niños por sede', n: null, ws: () => hojaTabla(filasResumenSede(modelo, sede)) },
    { id: 'revisiones', nombre: 'Revisiones', desc: 'Todas las decisiones de Aprobar / No aprobar', n: L.revisados.length, ws: () => hojaDesde(L.revisados, [C.sede, C.ced, C.colaborador, C.nino, C.doc, { id: 'base', label: 'Estado antes de revisar', valor: (k) => k.estadoBase }, C.motivo, ...COLS_REVISION]) },
    { id: 'plan', nombre: 'Plan de compra', desc: 'Juguetes y cantidades por rango, contra el presupuesto (todas las sedes)', n: null, ws: () => hojaTabla(filasPlanCompra(P), { 6: '"$"#,##0', 8: '"$"#,##0' }) },
    { id: 'estimado', nombre: 'Presupuesto estimado', desc: 'Reparto proporcional de la plata por rango y sugerencia', n: null, ws: () => hojaTabla(filasEstimado(P), { 4: '0.0%', 5: '"$"#,##0', 6: '"$"#,##0', 9: '"$"#,##0', 10: '"$"#,##0' }) },
  ] : [];
  const descargarHojas = (ids) => {
    const hojas = hojasDisponibles.filter((h) => ids.includes(h.id)).map((h) => ({ nombre: h.nombre, ws: h.ws() }));
    if (!hojas.length) return;
    const nombre = ids.length === 1 ? `Regalos${CONFIG.anio}_${slug(hojas[0].nombre)}_${slug(nombreSede)}_${hoyIso()}.xlsx` : `Regalos${CONFIG.anio}_${slug(nombreSede)}_${hoyIso()}.xlsx`;
    descargarLibro(hojas, nombre);
    setToast('Excel descargado');
  };
  const descargarPlanilla = async (sedePdf, formato) => {
    setOcupado('Armando la planilla de firmas…');
    try {
      const sedes = sedePdf ? [sedePdf] : modelo.sedes;
      const aprob = modelo.ninos.filter((k) => k.estado === 'aprobado');
      const base = `Planilla_firmas_${CONFIG.anio}_${slug(sedePdf || 'todas_las_sedes')}`;
      if (formato !== 'campos') descargarBytes(await generarPlanilla(aprob, { sedes, corte: modelo.corte, conCampos: false, logo: logo.current }), `${base}_imprimir.pdf`, 'application/pdf');
      if (formato !== 'imprimir') descargarBytes(await generarPlanilla(aprob, { sedes, corte: modelo.corte, conCampos: true, logo: logo.current }), `${base}_firma_digital.pdf`, 'application/pdf');
      setToast('Planilla descargada');
    } catch (e) { setError(e.message || String(e)); }
    setOcupado('');
  };

  // ---------- Pantalla inicial (sin datos)
  if (!cargadoLocal) return <Ocupado texto="Abriendo lo guardado…" />;
  if (!listo) {
    const falta = datosActivos && (!datosActivos.respuestas ? 'las respuestas del Forms' : 'el maestro de personal');
    return (
      <>
        <header className="topbar"><Marca /></header>
        <main className="hero">
          <h1>Regalos de Navidad {CONFIG.anio}</h1>
          <p>Arrastra el Excel del registro para ver cuántos niños hay, revisar los casos raros y sacar las planillas de firma por sede.</p>
          {falta && <div className="alert alert-warn">Ya leí {datosActivos.archivos.join(', ')}. Falta {falta}: arrastra el archivo que lo tenga.</div>}
          {error && <div className="alert alert-bad" role="alert">{error}</div>}
          <ZonaArchivo onArchivos={cargarExcel}>
            <b>Arrastra aquí el Excel</b>
            <span>o haz clic para escogerlo. Puedes soltar uno o varios archivos.</span>
          </ZonaArchivo>
          <ul className="req">
            <li><Icono.check />Una hoja con las respuestas del Forms tal como salen (columnas “Numero de Documento” y los bloques “(Hijo 1)” a “(Hijo 6)”).</li>
            <li><Icono.check />Una hoja con el maestro de personal activo (columnas “Empleado”, “Nombre del empleado”, “Descripcion C.O.”).</li>
          </ul>
          {copiaPublica && !nubeActiva && <AbrirConClave onAbrir={abrirConClave} />}
          <div className="hero-nube">
            <EstadoGuardado local={guardadoLocal} nube={nube} gh={gh} onGithub={() => setModal({ tipo: 'github' })} onSubir={() => subirNube(true)} />
            {!nubeActiva && !copiaPublica && <p className="sub">¿Ya hay una copia en GitHub? Conéctala y la página trae todo lo que se ha trabajado.</p>}
          </div>
          <p className="privacy"><Icono.lock />El Excel se lee aquí mismo, en tu navegador, y queda guardado en este equipo para la próxima vez. Si conectas GitHub, se guarda además una copia cifrada con la clave del equipo.</p>
        </main>
        {modal?.tipo === 'github' && <ModalGithub gh={gh} clave={claveNube} onCancelar={() => setModal(null)} onGuardar={guardarConfigGh} onDesconectar={desconectarGh} onBorrar={borrarEsteEquipo} />}
        {toast && <div className="toast" role="status">{toast}</div>}
        {ocupado && <Ocupado texto={ocupado} />}
        {devMode && <DevBar valor={fuenteDev} onCambio={setFuenteDev} />}
      </>
    );
  }

  const cuentas = { aprobados: L.aprobados.length, revisar: L.revisar.length, retirados: L.retirados.length, rechazados: L.rechazados.length, sin: L.sin.length };

  return (
    <>
      <header className="topbar">
        <Marca sub={datosActivos.archivos.join(', ')} />
        <div className="topbar-tools">
          <label className="field-inline">Entrega
            <input type="date" value={fechaEntrega} onChange={(e) => e.target.value && setFechaEntrega(e.target.value)} aria-label="Fecha de entrega (para calcular la edad)" />
          </label>
          <label className="field-inline">Sede
            <select value={sede} onChange={(e) => setSede(e.target.value)}>
              <option value="">Todas las sedes</option>
              {modelo.sedes.map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </label>
          <button className="btn btn-ghost btn-sm" onClick={() => setModal({ tipo: 'maestro' })}>Actualizar maestro</button>
          <button className="btn btn-ghost btn-sm" onClick={() => setModal({ tipo: 'excel' })}>Cargar otro Excel</button>
        </div>
      </header>

      <div className="layout">
        <aside className="sidebar">
          <nav className="nav" aria-label="Secciones">
            {VISTAS.map((v) => (
              <button key={v.id} aria-current={vista === v.id ? 'page' : undefined} onClick={() => setVista(v.id)}>
                <span className="dot" style={{ background: v.color }} />
                <span className="label">{v.label}</span>
                {cuentas[v.id] != null && <span className="count">{fmtNum(cuentas[v.id])}</span>}
              </button>
            ))}
          </nav>
          <div className="side-box">
            <h3>Guardado</h3>
            <p>{totalRevisiones ? plural(totalRevisiones, 'caso revisado', 'casos revisados') : 'Aún no hay casos revisados.'} Todo se guarda solo.</p>
            <EstadoGuardado local={guardadoLocal} nube={nube} gh={gh} onGithub={() => setModal({ tipo: 'github' })} onSubir={() => subirNube(true)} />
            <p style={{ marginTop: 4 }}>Archivo de respaldo (JSON con clave):</p>
            <div className="row">
              <button className="btn btn-sm" onClick={() => inputJson.current.click()}>Abrir archivo</button>
              <button className="btn btn-sm" onClick={() => setModal({ tipo: 'clave-guardar' })} disabled={!Object.keys(decisiones).length && !compras.fecha}>Descargar</button>
            </div>
            <input ref={inputJson} type="file" accept=".json,application/json" multiple hidden onChange={(e) => { abrirJson([...e.target.files]); e.target.value = ''; }} />
          </div>
        </aside>

        <main className="main" id="contenido">
          {error && <div className="alert alert-bad" role="alert">{error} <button className="btn-link" onClick={() => setError('')}>Cerrar</button></div>}

          {vista === 'resumen' && <VistaResumen L={L} modelo={modelo} sede={sede} setSede={setSede} setVista={setVista} />}

          {vista === 'aprobados' && (
            <Seccion titulo="Aprobados" texto={`Niños que reciben regalo en ${nombreSede.toLowerCase() === 'todas las sedes' ? 'todas las sedes' : nombreSede}. La sede es la del maestro.`}>
              <Tabla filas={L.aprobados} columnas={COLS_APROBADOS} filaClave={(k) => k.key}
                vacio={['Todavía no hay niños aprobados', 'Cuando lleguen inscripciones válidas aparecen aquí.']}
                extra={[{ id: 'ok', label: '', render: (k) => k.decision ? <span className="pill pill-ok">Revisado</span> : (k.sedeForms && k.sedeForms !== k.sede ? <span className="pill pill-muted" title={`En el Forms puso: ${k.sedeForms}`}>Otra sede en Forms</span> : null) }]}
                onDescargar={() => descargarHojas(['aprobados'])} />
            </Seccion>
          )}

          {vista === 'revisar' && (
            <Seccion titulo="Por revisar" texto="Casos raros que necesitan una llamada. Abre el documento, confirma y marca Aprobar o No aprobar. Los ya revisados siguen aquí para poder cambiarlos.">
              <Tabla filas={L.revisarTodo} columnas={COLS_REVISAR} filaClave={(k) => k.key} masivo={masivo} textoExtra={textoMotivos}
                vacio={['No hay casos por revisar', 'Todo lo inscrito cumple las reglas.']}
                extra={[
                  { id: 'motivos', label: 'Por qué', render: (k) => <ul className="reasons">{k.revisar.map((r, i) => <li key={i}>{r}</li>)}</ul> },
                  { id: 'foto', label: 'Documento', className: 'nowrap', render: (k) => k.foto ? <a href={k.foto} target="_blank" rel="noopener noreferrer">Ver foto</a> : <span className="sub">Sin foto</span> },
                  { id: 'dec', label: 'Revisión', render: (k) => <CeldaDecision k={k} onDecidir={pedirDecision} /> },
                ]}
                onDescargar={() => descargarHojas(['revisar'])} />
            </Seccion>
          )}

          {vista === 'retirados' && (
            <Seccion titulo="No están en el maestro" texto={`${plural(L.retiradosColab, 'colaborador inscribió', 'colaboradores inscribieron')} niños con una cédula que no está en el maestro activo: se retiró o la cédula quedó mal digitada. Si hay una cédula o nombre parecido en el maestro, se muestra para ayudar a decidir.`}>
              <div className="alert" style={{ display: 'flex', gap: 12, alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', marginBottom: 14 }}>
                <span>¿Entró personal nuevo o corrigieron cédulas? Actualiza el maestro y esta lista se recalcula sola.</span>
                <button className="btn btn-primary btn-sm" onClick={() => setModal({ tipo: 'maestro' })}>Actualizar maestro</button>
              </div>
              <Tabla filas={L.retirados} columnas={COLS_RETIRADOS} filaClave={(k) => k.key} masivo={masivo} textoExtra={textoMotivos}
                vacio={['Todos están en el maestro', 'Ninguna cédula inscrita falta en el maestro activo.']}
                extra={[
                  { id: 'sug', label: 'Qué se encontró', render: (k) => (k.sugerencias.length || k.revisar.length)
                      ? <ul className="reasons">{[...k.sugerencias, ...k.revisar].map((s, i) => <li key={i}>{s}</li>)}</ul>
                      : <span className="sub">Nada parecido en el maestro</span> },
                  { id: 'foto', label: 'Documento', className: 'nowrap', render: (k) => k.foto ? <a href={k.foto} target="_blank" rel="noopener noreferrer">Ver foto</a> : <span className="sub">Sin foto</span> },
                  { id: 'dec', label: 'Revisión', render: (k) => <CeldaDecision k={k} onDecidir={pedirDecision} /> },
                ]}
                onDescargar={() => descargarHojas(['retirados'])} />
            </Seccion>
          )}

          {vista === 'rechazados' && (
            <Seccion titulo="Rechazados" texto="No cumplen la edad, están repetidos (ya los inscribió otra persona o el mismo colaborador con otro documento) o se marcaron como No aprobado. Los repetidos no se revisan: el niño ya cuenta una vez.">
              <Tabla filas={L.rechazados} columnas={COLS_RECHAZADOS} filaClave={(k) => k.key} masivo={masivo} textoExtra={textoMotivos}
                vacio={['No hay rechazados', 'Ningún niño incumple las reglas.']}
                extra={[
                  { id: 'mot', label: 'Motivo', render: (k) => <span style={{ display: 'block', minWidth: 220, fontSize: 12 }}>{motivoEstado(k)}</span> },
                  { id: 'dec', label: 'Revisión', render: (k) => <CeldaDecision k={k} onDecidir={pedirDecision} /> },
                ]}
                onDescargar={() => descargarHojas(['rechazados'])} />
            </Seccion>
          )}

          {vista === 'sin' && (
            <Seccion titulo="Sin inscribir" texto="Colaboradores activos del maestro que no han respondido el Forms (ni siquiera para decir que no tienen hijos). Sirve para los recordatorios por sede.">
              <Tabla filas={L.sin} columnas={COLS_SIN} filaClave={(m) => m.ced}
                vacio={['Todos respondieron', 'No queda nadie del maestro sin responder.']}
                onDescargar={() => descargarHojas(['sin'])} />
            </Seccion>
          )}

          {vista === 'presupuesto' && <VistaPresupuesto P={P} compras={compras} cambiarCompras={cambiarCompras}
            onExcel={() => descargarHojas(['plan', 'estimado'])} onPedido={descargarPedido} setToast={setToast} setError={setError} />}

          {vista === 'descargas' && <VistaDescargas hojas={hojasDisponibles} sedeActual={sede} sedes={modelo.sedes} nombreSede={nombreSede}
            aprobadosPorSede={(s) => modelo.ninos.filter((k) => k.estado === 'aprobado' && (!s || k.sede === s)).length}
            onExcel={descargarHojas} onPdf={descargarPlanilla} />}
        </main>
      </div>

      {modal?.tipo === 'decision-masiva' && <ModalDecisionMasiva {...modal} revisor={revisor} onCancelar={() => setModal(null)} onGuardar={guardarDecisionMasiva} />}
      {modal?.tipo === 'decision' && <ModalDecision {...modal} revisor={revisor} onCancelar={() => setModal(null)} onGuardar={guardarDecision} />}
      {modal?.tipo === 'github' && <ModalGithub gh={gh} clave={claveNube} onCancelar={() => setModal(null)} onGuardar={guardarConfigGh} onDesconectar={desconectarGh} onBorrar={borrarEsteEquipo} />}
      {modal?.tipo === 'clave-guardar' && <ModalClaveGuardar onCancelar={() => setModal(null)} onGuardar={descargarJson} />}
      {modal?.tipo === 'clave-abrir' && <ModalClaveAbrir mala={modal.mala} onCancelar={() => setModal(null)} onAbrir={(c) => abrirJson(modal.files, c)} />}
      {modal?.tipo === 'maestro' && <ModalMaestro onCerrar={() => setModal(null)} onArchivos={cargarMaestro} total={datos?.maestro?.length || 0} />}
      {modal?.tipo === 'maestro-ok' && <ModalMaestroOk r={modal.resumen} onCerrar={() => setModal(null)} onVer={() => { setModal(null); setVista('retirados'); }} />}
      {modal?.tipo === 'excel' && (
        <Modal titulo="Cargar otro Excel" texto="Reemplaza los datos actuales (también en la copia de GitHub). Las revisiones se conservan." onCerrar={() => setModal(null)}>
          <ZonaArchivo compacta onArchivos={(f) => { setModal(null); cargarExcel(f); }}><b>Arrastra aquí el Excel</b><span>o haz clic para escogerlo</span></ZonaArchivo>
          <div className="modal-actions" style={{ marginTop: 14 }}><button className="btn" onClick={() => setModal(null)}>Cancelar</button></div>
        </Modal>
      )}
      {toast && <div className="toast" role="status">{toast}</div>}
      {ocupado && <Ocupado texto={ocupado} />}
      {devMode && <DevBar valor={fuenteDev} onCambio={setFuenteDev} />}
    </>
  );
}

function filasResumenSede(modelo, sedeSel) {
  const out = [['Sede', 'Activos en maestro', 'Respondieron', '% respondió', 'Niños aprobados', 'Femenino', 'Masculino', ...CONFIG.rangos.map((r) => r.label), 'Por revisar', 'No están en maestro', 'Rechazados']];
  for (const s of modelo.sedes) {
    if (sedeSel && s !== sedeSel) continue;
    const act = modelo.maestroActivo.filter((m) => m.sede === s);
    const resp = act.filter((m) => modelo.colaboradores.has(m.ced)).length;
    const ns = modelo.ninos.filter((k) => k.sede === s);
    const ap = ns.filter((k) => k.estado === 'aprobado');
    const { porRango } = contar(ap);
    out.push([s, act.length, resp, act.length ? Math.round((resp / act.length) * 100) / 100 : '', ap.length,
      ap.filter((k) => k.g === 'F').length, ap.filter((k) => k.g === 'M').length, ...CONFIG.rangos.map((r) => totalG(porRango[r.id])),
      ns.filter((k) => k.estado === 'revisar').length, ns.filter((k) => k.estadoBase === 'retirado' && !k.decision).length, ns.filter((k) => k.estado === 'rechazado').length]);
  }
  return out;
}

/* ---------- Vista Resumen ---------- */
function VistaResumen({ L, modelo, sede, setSede, setVista }) {
  const pct = L.activos.length ? L.respondieron / L.activos.length : 0;
  const filas = useMemo(() => filasResumenSede(modelo, '').slice(1), [modelo]);
  const totales = filas.reduce((t, f) => f.map((v, i) => (i === 0 || i === 3 ? '' : (t[i] || 0) + v)), []);
  return (
    <>
      <div className="page-head">
        <div>
          <p style={{ margin: 0 }}>{sede || 'Todas las sedes'}</p>
          <div className="lead">
            <span className="big">{fmtNum(L.aprobados.length)}</span>
            <span className="big-label">{L.aprobados.length === 1 ? 'niño aprobado para recibir regalo' : 'niños aprobados para recibir regalo'}</span>
          </div>
        </div>
      </div>
      <div className="facts">
        <div className="fact"><b>{fmtNum(L.colabAprob)}</b><span>{L.colabAprob === 1 ? 'colaborador con niños' : 'colaboradores con niños'}</span></div>
        <div className="fact"><b>{fmtPct(pct)}</b><span>{fmtNum(L.respondieron)} de {fmtNum(L.activos.length)} activos respondieron</span></div>
        <div className="fact"><button onClick={() => setVista('revisar')}><b style={{ color: L.revisar.length ? 'var(--warn)' : undefined }}>{fmtNum(L.revisar.length)}</b><span>por revisar</span></button></div>
        <div className="fact"><button onClick={() => setVista('retirados')}><b>{fmtNum(L.retiradosColab)}</b><span>{L.retiradosColab === 1 ? 'cédula no está en el maestro' : 'cédulas no están en el maestro'}</span></button></div>
        <div className="fact"><button onClick={() => setVista('rechazados')}><b>{fmtNum(L.rechazados.length)}</b><span>rechazados</span></button></div>
      </div>

      <section className="section">
        <div className="section-head">
          <div><h2>Niños por edad</h2><p>Cada columna es una edad; abajo, los rangos para la compra.</p></div>
          <div className="legend"><span><i style={{ background: 'var(--fem)' }} />Femenino {fmtNum(L.aprobados.filter((k) => k.g === 'F').length)}</span><span><i style={{ background: 'var(--mas)' }} />Masculino {fmtNum(L.aprobados.filter((k) => k.g === 'M').length)}</span></div>
        </div>
        {L.aprobados.length ? <EscaleraEdades porEdad={L.porEdad} porRango={L.porRango} corte={modelo.corte} /> : <div className="empty"><b>Sin niños aprobados</b>{sede ? 'Esta sede todavía no tiene niños aprobados.' : 'Todavía no hay niños aprobados.'}</div>}
      </section>

      <section className="section">
        <div className="section-head">
          <div><h2>Por sede</h2><p>La sede es la del maestro. Toca una fila para ver solo esa sede.</p></div>
          {sede && <button className="btn btn-sm" onClick={() => setSede('')}>Ver todas las sedes</button>}
        </div>
        <div className="table-wrap">
          <table>
            <thead><tr>
              <th>Sede</th><th className="num">Activos</th><th className="num">Respondieron</th><th className="num">%</th><th className="num">Niños</th>
              <th className="num">F</th><th className="num">M</th>{CONFIG.rangos.map((r) => <th key={r.id} className="num">{r.label}</th>)}<th className="num">Por revisar</th>
            </tr></thead>
            <tbody>
              {filas.map((f) => (
                <tr key={f[0]} className={'clickable' + (sede === f[0] ? ' is-selected' : '')} onClick={() => setSede(sede === f[0] ? '' : f[0])}
                  tabIndex={0} onKeyDown={(e) => { if (e.key === 'Enter') setSede(sede === f[0] ? '' : f[0]); }}>
                  <td style={{ minWidth: 180 }}>{f[0]}</td><td className="num">{fmtNum(f[1])}</td><td className="num">{fmtNum(f[2])}</td>
                  <td className="num">{f[3] === '' ? '–' : fmtPct(f[3])}</td><td className="num"><b>{fmtNum(f[4])}</b></td>
                  <td className="num">{fmtNum(f[5])}</td><td className="num">{fmtNum(f[6])}</td>
                  {CONFIG.rangos.map((r, i) => <td key={r.id} className="num">{fmtNum(f[7 + i])}</td>)}
                  <td className="num" style={{ color: f[7 + CONFIG.rangos.length] ? 'var(--warn)' : undefined }}>{fmtNum(f[7 + CONFIG.rangos.length])}</td>
                </tr>
              ))}
            </tbody>
            <tfoot><tr>
              <td>Total</td><td className="num">{fmtNum(totales[1])}</td><td className="num">{fmtNum(totales[2])}</td>
              <td className="num">{totales[1] ? fmtPct(totales[2] / totales[1]) : '–'}</td><td className="num">{fmtNum(totales[4])}</td>
              <td className="num">{fmtNum(totales[5])}</td><td className="num">{fmtNum(totales[6])}</td>
              {CONFIG.rangos.map((r, i) => <td key={r.id} className="num">{fmtNum(totales[7 + i])}</td>)}
              <td className="num">{fmtNum(totales[7 + CONFIG.rangos.length])}</td>
            </tr></tfoot>
          </table>
        </div>
      </section>
    </>
  );
}

/* ---------- Vista Descargas ---------- */
function VistaDescargas({ hojas, sedeActual, sedes, nombreSede, aprobadosPorSede, onExcel, onPdf }) {
  const [marcadas, setMarcadas] = useState(() => hojas.map((h) => h.id));
  const [sedePdf, setSedePdf] = useState(sedeActual);
  const [formato, setFormato] = useState('imprimir');
  const todas = marcadas.length === hojas.length;
  const nPdf = aprobadosPorSede(sedePdf);
  return (
    <>
      <div className="page-head"><div><h1>Descargas</h1><p>Los listados en Excel salen con el filtro de sede de arriba: <b>{nombreSede}</b>.</p></div></div>
      <div className="grid-2">
        <section className="section">
          <div className="section-head"><div><h2>Listados en Excel</h2><p>Escoge qué hojas quieres. Todo sale en un solo archivo.</p></div>
            <button className="btn-link" onClick={() => setMarcadas(todas ? [] : hojas.map((h) => h.id))}>{todas ? 'Quitar todas' : 'Marcar todas'}</button></div>
          <div className="checks">
            {hojas.map((h) => (
              <label className="check" key={h.id}>
                <input type="checkbox" checked={marcadas.includes(h.id)} onChange={(e) => setMarcadas((m) => (e.target.checked ? [...m, h.id] : m.filter((x) => x !== h.id)))} />
                <span>{h.nombre}<small>{h.desc}</small></span>
                {h.n != null && <em>{fmtNum(h.n)}</em>}
              </label>
            ))}
          </div>
          <button className="btn btn-primary" disabled={!marcadas.length} onClick={() => onExcel(marcadas)}>
            Descargar Excel{marcadas.length ? ` (${plural(marcadas.length, 'hoja', 'hojas')})` : ''}
          </button>
        </section>

        <section className="section">
          <div className="section-head"><div><h2>Planilla de firmas</h2><p>Una fila por niño aprobado. Cada sede empieza en hoja nueva, con el logo y el espacio para que firme el colaborador.</p></div></div>
          <div className="form-row">
            <label htmlFor="sedePdf">Sede</label>
            <select id="sedePdf" value={sedePdf} onChange={(e) => setSedePdf(e.target.value)}>
              <option value="">Todas las sedes (un solo PDF)</option>
              {sedes.map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div className="form-row">
            <span className="lbl" id="lblFormato">Formato</span>
            <div className="segmented" role="group" aria-labelledby="lblFormato">
              {[['imprimir', 'Para imprimir'], ['campos', 'Con firma digital'], ['ambos', 'Los dos']].map(([v, t]) => (
                <button key={v} aria-pressed={formato === v} onClick={() => setFormato(v)}>{t}</button>
              ))}
            </div>
            <p className="hint">{formato === 'imprimir' ? 'Se imprime y se firma a mano.' : 'Cada casilla de firma trae un campo para firmar en Adobe Acrobat o Reader (computador o tablet).'}</p>
          </div>
          <button className="btn btn-primary" disabled={!nPdf} onClick={() => onPdf(sedePdf, formato)}>
            {nPdf ? `Descargar planilla (${plural(nPdf, 'niño', 'niños')})` : 'Esta sede no tiene niños aprobados'}
          </button>
        </section>
      </div>
    </>
  );
}

/* ---------- Vista Presupuesto y compra ----------
   Arriba: cuánto hay y cuánto se usa. Luego el plan real (lo que ustedes
   escogen) contra el estimado (reparto proporcional + sugerencia).
   Al final, el catálogo de juguetes. */
function VistaPresupuesto({ P, compras, cambiarCompras, onExcel, onPedido, setToast, setError }) {
  const inputCat = useRef(null);

  // El plan se guarda por grupo de edad: plan["1-3:1-3"] = [{ codigo, cantidad }]
  // (con el catálogo actual cada rango es un solo grupo; si un catálogo nuevo trae otras
  //  edades, un rango se puede partir en varios grupos)
  const setPlanGrupo = (gid, filas) => cambiarCompras((c) => ({ plan: { ...c.plan, [gid]: filas } }));
  const copiarSugerencia = () => {
    if (P.hayPlan && !window.confirm('Esto reemplaza el plan de TODAS las edades por la sugerencia. ¿Seguir?')) return;
    cambiarCompras({ plan: Object.fromEntries(P.grupos.map((g) => [g.id, g.sugerencia.items.map((x) => ({ ...x }))])) });
    setToast('La sugerencia quedó como plan de compra');
  };
  // Usa la sugerencia en un rango completo (todos sus grupos de edad); los demás rangos no se tocan
  const copiarSugerenciaRango = (r) => {
    cambiarCompras((c) => ({ plan: { ...c.plan, ...Object.fromEntries(r.grupos.map((g) => [g.id, g.sugerencia.items.map((x) => ({ ...x }))])) } }));
    setToast(`Sugerencia aplicada en ${r.label}`);
  };
  const cargarCatalogo = async (file) => {
    try {
      const cat = await leerCatalogoExcel(file);
      cambiarCompras({ catalogo: cat });
      setToast(`Catálogo cargado: ${plural(cat.length, 'juguete', 'juguetes')}`);
    } catch (e) { setError(e.message); }
  };

  return (
    <>
      <div className="page-head">
        <div>
          <h1>Presupuesto y compra</h1>
          <p>Cuántos juguetes comprar con la plata que hay. Cada niño recibe un juguete de SU edad según el catálogo. Cuenta los niños aprobados de todas las sedes, con la edad a la fecha de entrega.</p>
        </div>
        <div className="row" style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <button className="btn btn-primary btn-sm" onClick={onPedido} title="Descarga el formato FP- Pedido TPS 2026 de Toy Park ya lleno con el plan de compra">Llenar formato Toy Park</button>
          <button className="btn btn-ghost btn-sm" onClick={onExcel}>Descargar plan en Excel</button>
        </div>
      </div>

      {/* Guía corta: los pasos sí van en orden */}
      <ol className="guide">
        <li><b>Define la plata.</b> Escribe el presupuesto y cuánto de él usar para juguetes.</li>
        <li><b>Mira el estimado.</b> La plata se reparte según cuántos niños hay en cada rango, con una sugerencia de compra.</li>
        <li><b>Arma el plan.</b> En cada rango escoge juguetes y cantidades. Arriba ves si alcanza la plata y si hay juguete para todos.</li>
      </ol>

      {/* 1. Presupuesto */}
      <section className="section">
        <div className="budget-controls">
          <div className="form-row">
            <label htmlFor="ptotal">Presupuesto total</label>
            <input id="ptotal" type="text" inputMode="numeric" className="money-input"
              value={fmtNum(compras.total)} onChange={(e) => cambiarCompras({ total: Number(soloDigitos(e.target.value)) || 0 })} />
          </div>
          <div className="form-row">
            <label htmlFor="ppct">Usar para juguetes: <b>{compras.pct}%</b></label>
            <input id="ppct" type="range" min="0" max="100" step="1" value={compras.pct} onChange={(e) => cambiarCompras({ pct: +e.target.value })} />
            <p className="hint">{fmtCOP(P.aUsar)} para juguetes. Reserva: {fmtCOP(P.reserva)}.</p>
          </div>
          <label className="check" style={{ alignSelf: 'center' }}>
            <input type="checkbox" checked={compras.incluirPendientes} onChange={(e) => cambiarCompras({ incluirPendientes: e.target.checked })} />
            <span>Contar también los pendientes<small>Por revisar y los que no están en el maestro, sin decisión todavía</small></span>
          </label>
        </div>

        {/* Resumen de GASTO sobre el presupuesto total: gastado / disponible / reserva */}
        <div className="budget-meter">
          {(() => {
            const total = compras.total || 0;
            const gasto = P.costoPlan;                          // lo que cuesta el plan de compra
            const sugTotal = P.grupos.reduce((s, g) => s + g.sugerencia.costo, 0);
            const queda = total - gasto;                        // lo que queda del presupuesto total
            const disponible = Math.max(0, P.aUsar - gasto);    // de la plata para juguetes, lo que no se ha usado
            const pctDe = (x) => (total ? x / total : 0);
            // Anchos de la barra (sobre el presupuesto total, sin pasar del 100 %)
            const wGasto = Math.min(1, pctDe(gasto));
            const wDisp = Math.min(1 - wGasto, pctDe(disponible));
            const wRes = Math.max(0, Math.min(1 - wGasto - wDisp, pctDe(P.reserva)));
            const pasado = gasto > P.aUsar;                     // el plan se pasa de la plata para juguetes
            return (
              <>
                <p className="gasto-frase">
                  Del presupuesto de <b>{fmtCOP(total)}</b>{' '}
                  {P.hayPlan
                    ? <>se gastan <b className={pasado ? 'neg' : 'tint'}>{fmtCOP(gasto)} ({fmtPct(pctDe(gasto))})</b> y {queda >= 0 ? <>quedan <b>{fmtCOP(queda)} ({fmtPct(pctDe(queda))})</b></> : <>faltan <b className="neg">{fmtCOP(-queda)}</b></>}.
                        {pasado && queda >= 0 && <> <b className="neg">Ojo: se pasa {fmtCOP(gasto - P.aUsar)} del {compras.pct}% que separaron para juguetes.</b></>}</>
                    : <>todavía no se gasta nada: falta armar el plan. Con la sugerencia se gastarían <b>{fmtCOP(sugTotal)} ({fmtPct(pctDe(sugTotal))})</b>.</>}
                </p>
                <div className="stack" role="img" aria-label={`Gastado ${fmtPct(pctDe(gasto))}, disponible ${fmtPct(pctDe(disponible))}, reserva ${fmtPct(pctDe(P.reserva))}`}>
                  <i className={'s-gasto' + (pasado ? ' over' : '')} style={{ width: `${wGasto * 100}%` }} />
                  <i className="s-disp" style={{ width: `${wDisp * 100}%` }} />
                  <i className="s-res" style={{ width: `${wRes * 100}%` }} />
                </div>
                <div className="budget-figures">
                  <div><b className={pasado ? 'neg' : ''}><i className={'sw s-gasto' + (pasado ? ' over' : '')} />{fmtCOP(gasto)}</b><span>gastado en el plan ({plural(P.unidadesPlan, 'juguete', 'juguetes')}), {fmtPct(pctDe(gasto))}</span></div>
                  <div><b><i className="sw s-disp" />{fmtCOP(pasado ? 0 : disponible)}</b><span>disponible para juguetes{pasado ? ` (el plan se pasa ${fmtCOP(gasto - P.aUsar)})` : ''}</span></div>
                  {P.reserva > 0 && <div><b><i className="sw s-res" />{fmtCOP(P.reserva)}</b><span>reserva ({fmtPct(pctDe(P.reserva))})</span></div>}
                  <div><b>{fmtNum(P.totalNinos)}</b><span>niños, {fmtCOP(P.totalNinos ? P.aUsar / P.totalNinos : 0)} por niño</span></div>
                </div>
              </>
            );
          })()}
          <p className="hint">
            {P.hayPlan && (P.faltanPlan > 0
              ? <b className="neg">Faltan juguetes para {plural(P.faltanPlan, 'niño', 'niños')}. </b>
              : <b className="pos">Hay juguete para todos los niños. </b>)}
            {P.fueraDeEdad.length > 0 && <b className="warn">{plural(P.fueraDeEdad.length, 'juguete no es', 'juguetes no son')} para la edad donde está. </b>}
            {P.sinEdad ? `${plural(P.sinEdad, 'niño aprobado no tiene', 'niños aprobados no tienen')} una edad entre 0 y 10 años a la fecha de entrega y no se cuenta.` : ''}
          </p>
