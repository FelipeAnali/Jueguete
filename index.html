          {/* Gasto por rango */}
          {P.hayPlan && (
            <div className="table-wrap" style={{ marginTop: 14 }}>
              <table>
                <thead><tr><th>Rango</th><th className="num">Niños</th><th className="num">Juguetes</th><th className="num">Gastado</th><th className="num">% del presupuesto</th><th className="num">Por niño</th></tr></thead>
                <tbody>
                  {P.rangos.map((r) => (
                    <tr key={r.id}>
                      <td className="nowrap">{r.label}</td><td className="num">{fmtNum(r.n)}</td>
                      <td className={'num' + (r.faltan ? ' neg' : '')}>{fmtNum(r.unidades)}{r.faltan ? ` (faltan ${fmtNum(r.faltan)})` : ''}</td>
                      <td className="num nowrap">{fmtCOP(r.costo)}</td>
                      <td className="num">{fmtPct(compras.total ? r.costo / compras.total : 0)}</td>
                      <td className="num nowrap">{fmtCOP(r.unidades ? r.costo / r.unidades : 0)}</td>
                    </tr>
                  ))}
                </tbody>
                <tfoot><tr>
                  <td>Total</td><td className="num">{fmtNum(P.totalNinos)}</td><td className="num">{fmtNum(P.unidadesPlan)}</td>
                  <td className="num nowrap">{fmtCOP(P.costoPlan)}</td><td className="num">{fmtPct(compras.total ? P.costoPlan / compras.total : 0)}</td>
                  <td className="num nowrap">{fmtCOP(P.unidadesPlan ? P.costoPlan / P.unidadesPlan : 0)}</td>
                </tr></tfoot>
              </table>
            </div>
          )}
        </div>
      </section>

      {/* 2. Plan real: un bloque por rango, adentro sus grupos de edad */}
      <section className="section">
        <div className="section-head">
          <div><h2>Plan de compra</h2><p>En cada rango solo se ofrecen los juguetes del catálogo para esa edad. Puedes mezclar: por ejemplo pocos del caro y el resto de uno más barato.</p></div>
          <button className="btn btn-sm" onClick={copiarSugerencia} disabled={!P.totalNinos}>Usar la sugerencia como plan</button>
        </div>
        <div className="plan-grid">
          {P.rangos.map((r) => (
            <div className="plan-range" key={r.id}>
              <div className="plan-head">
                <div><b>{r.label}</b><span>{plural(r.n, 'niño', 'niños')} (F {fmtNum(r.F)}, M {fmtNum(r.M)})</span></div>
                <div className="plan-money"><span>Plata estimada</span><b>{fmtCOP(r.plata)}</b></div>
              </div>
              {r.grupos.map((g) => <GrupoPlan key={g.id} g={g} unico={r.grupos.length === 1} filasGuardadas={compras.plan[g.id] || []} P={P} onCambiar={(filas) => setPlanGrupo(g.id, filas)} />)}
              {!r.conPlan && r.sugUnidades > 0 && (
                <button className="btn btn-sm" style={{ alignSelf: 'flex-start' }} onClick={() => copiarSugerenciaRango(r)}>Usar la sugerencia en {r.label}</button>
              )}
              <div className="plan-foot plan-foot-total">
                {!r.conPlan
                  ? <span className="muted">Necesita {plural(r.n, 'juguete', 'juguetes')}</span>
                  : <span className={r.faltan > 0 ? 'neg' : 'pos'}>{r.faltan > 0 ? `Faltan juguetes para ${plural(r.faltan, 'niño', 'niños')}` : 'Todos los niños del rango tienen juguete'}</span>}
                <span>Total {fmtCOP(r.costo)}{r.conPlan && r.plata !== r.costo
                  ? <small className={r.plata - r.costo < 0 ? 'neg' : ''}>{r.plata - r.costo < 0 ? ` se pasa ${fmtCOP(r.costo - r.plata)} del estimado` : ` quedan ${fmtCOP(r.plata - r.costo)} del estimado`}</small>
                  : null}</span>
              </div>
            </div>
          ))}
        </div>
      </section>

      {/* 3. Estimado, por grupo de edad */}
      <section className="section">
        <div className="section-head"><div><h2>Estimado</h2><p>La plata se reparte según cuántos niños hay de cada edad (el mismo valor por niño). Con esa plata se sugiere qué comprar, repartiendo los niños por igual entre los juguetes de su edad; si no alcanza, se quitan los más caros.</p></div></div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Rango</th><th>Edades</th><th>Juguetes de</th><th className="num">Niños</th><th className="num">Plata</th><th>Sugerencia</th><th className="num">Costo</th><th className="num">Sobra</th></tr></thead>
            <tbody>
              {P.grupos.map((g, i) => (
                <tr key={g.id}>
                  <td className="nowrap">{i === 0 || P.grupos[i - 1].rango.id !== g.rango.id ? <b>{g.rango.label}</b> : ''}</td>
                  <td className="nowrap">{g.label}</td>
                  <td className="nowrap">{g.edadesCatalogo ? `${g.edadesCatalogo} años` : '–'}</td>
                  <td className="num">{fmtNum(g.n)}</td>
                  <td className="num nowrap">{fmtCOP(g.plata)}</td>
                  <td style={{ minWidth: 220 }}>
                    {g.sirven.length === 0 ? <span className="sub neg">El catálogo no tiene juguetes para esta edad</span>
                      : g.n === 0 ? <span className="sub">Sin niños</span>
                      : <ul className="reasons">{g.sugerencia.items.map((x) => <li key={x.codigo}>{fmtNum(x.cantidad)} × {P.porCodigo.get(x.codigo)?.nombre}</li>)}
                          {g.sugerencia.unidades < g.n && <li className="neg">No alcanza: faltan {fmtNum(g.n - g.sugerencia.unidades)}</li>}</ul>}
                  </td>
                  <td className="num nowrap">{fmtCOP(g.sugerencia.costo)}</td>
                  <td className="num nowrap">{fmtCOP(g.plata - g.sugerencia.costo)}</td>
                </tr>
              ))}
            </tbody>
            <tfoot><tr>
              <td colSpan={3}>Total</td><td className="num">{fmtNum(P.totalNinos)}</td><td className="num nowrap">{fmtCOP(P.aUsar)}</td><td />
              <td className="num nowrap">{fmtCOP(P.grupos.reduce((s, g) => s + g.sugerencia.costo, 0))}</td>
              <td className="num nowrap">{fmtCOP(P.grupos.reduce((s, g) => s + g.plata - g.sugerencia.costo, 0))}</td>
            </tr></tfoot>
          </table>
        </div>
      </section>

      {/* 4. Catálogo */}
      <section className="section">
        <div className="section-head">
          <div><h2>Catálogo de juguetes</h2><p>La edad del catálogo decide a qué niños se les puede dar cada juguete. El precio se puede corregir aquí mismo.</p></div>
          <div className="row" style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            <button className="btn btn-sm" onClick={() => inputCat.current.click()}>Cargar catálogo desde Excel</button>
            <button className="btn btn-sm btn-ghost" onClick={() => { if (window.confirm('¿Volver al catálogo original? Los precios que cambiaste se pierden.')) cambiarCompras({ catalogo: CATALOGO_BASE }); }}>Catálogo original</button>
            <input ref={inputCat} type="file" accept=".xlsx,.xlsm,.xls" hidden onChange={(e) => { if (e.target.files[0]) cargarCatalogo(e.target.files[0]); e.target.value = ''; }} />
          </div>
        </div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Código</th><th>Juguete</th><th>Edad catálogo</th><th>Se le da a</th><th className="num">Precio</th></tr></thead>
            <tbody>
              {compras.catalogo.map((t) => (
                <tr key={t.codigo}>
                  <td className="mono">{t.codigo}</td><td className="wrap">{t.nombre}</td><td className="nowrap">{t.edadTxt} {t.edadTxt === '1' ? 'año' : 'años'}</td>
                  <td>{usosDeJuguete(t, P.grupos).map((g) => `${g.label} (rango ${g.rango.label})`).join(', ') || '–'}</td>
                  <td className="num">
                    <input className="price-input" type="text" inputMode="numeric" aria-label={`Precio de ${t.nombre}`} value={fmtNum(t.precio)}
                      onChange={(e) => cambiarCompras((c) => ({ catalogo: c.catalogo.map((x) => (x.codigo === t.codigo ? { ...x, precio: Number(soloDigitos(e.target.value)) || 0 } : x)) }))} />
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>
    </>
  );
}

// Un grupo de edad dentro de un rango: sus juguetes, cantidades y si alcanza para todos
// unico = el rango tiene un solo grupo de edad (no se repite el encabezado de edad y plata)
function GrupoPlan({ g, filasGuardadas, P, onCambiar, unico }) {
  const falta = g.n - g.unidades;
  const opciones = [...g.sirven].sort((a, b) => a.precio - b.precio); // solo juguetes de esta edad
  const cambiarFila = (idx, cambio) => onCambiar(filasGuardadas.map((x, i) => (i === idx ? { ...x, ...cambio } : x)));
  const usados = new Set(filasGuardadas.map((x) => x.codigo));
  const siguiente = opciones.find((t) => !usados.has(t.codigo));
  return (
    <div className="plan-group">
      {unico
        ? <div className="plan-group-head"><span>{g.edadesCatalogo ? `Juguetes del catálogo para ${g.edadesCatalogo} ${g.edadesCatalogo === '1' ? 'año' : 'años'}` : 'Sin juguetes en el catálogo'}</span></div>
        : <div className="plan-group-head">
            <b>{g.label}</b>
            <span>{plural(g.n, 'niño', 'niños')}{g.edadesCatalogo ? `, juguetes de ${g.edadesCatalogo} años` : ''}</span>
            <span className="plan-group-money">{fmtCOP(g.plata)}</span>
          </div>}
      {g.sirven.length === 0 && g.n > 0 && <p className="hint neg">El catálogo no tiene juguetes para esta edad: agrega uno en el Excel del catálogo.</p>}
      {g.filasPlan.length === 0 && g.n > 0 && g.sugerencia.items.length > 0 && (
        <p className="hint">Sugerencia: {g.sugerencia.items.map((x) => `${fmtNum(x.cantidad)} × ${P.porCodigo.get(x.codigo)?.nombre}`).join(', ')}{g.sugerencia.unidades < g.n ? ` (alcanza para ${fmtNum(g.sugerencia.unidades)} de ${fmtNum(g.n)})` : ''}.</p>
      )}
      {g.filasPlan.map((f) => {
        // Cuántas unidades de este juguete caben con la plata estimada del grupo (descontando los otros juguetes)
        const libre = g.plata - (g.costo - f.subtotal);
        const caben = f.precio ? Math.max(0, Math.floor(libre / f.precio)) : 0;
        const enOtras = new Set(g.filasPlan.filter((x) => x.i !== f.i).map((x) => x.codigo)); // no repetir juguete
        return (
          <div className="plan-row" key={f.i}>
            <select aria-label="Juguete" value={f.codigo} onChange={(e) => cambiarFila(f.i, { codigo: e.target.value })} className={f.sirve ? '' : 'mal'}>
              {!f.sirve && <option value={f.codigo}>{f.juguete ? `${f.juguete.nombre} (no es para esta edad)` : '(no está en el catálogo)'}</option>}
              {opciones.map((t) => <option key={t.codigo} value={t.codigo} disabled={enOtras.has(t.codigo)}>{t.nombre}, {fmtCOP(t.precio)}</option>)}
            </select>
            <input aria-label="Cantidad" type="number" min="0" step="1" value={f.cantidad || ''} placeholder="0"
              onChange={(e) => cambiarFila(f.i, { cantidad: Math.max(0, Math.floor(+e.target.value || 0)) })} />
            <span className="plan-sub" title={`Con la plata estimada de esta edad (descontando los otros juguetes) alcanzan ${fmtNum(caben)} unidades de este`}>{fmtCOP(f.subtotal)}<small>caben {fmtNum(caben)}</small></span>
            <button className="btn-x" aria-label="Quitar juguete" onClick={() => onCambiar(filasGuardadas.filter((_, i) => i !== f.i))}>×</button>
          </div>
        );
      })}
      <div className="plan-foot">
        {siguiente && g.n > 0
          ? <button className="btn-link" onClick={() => onCambiar([...filasGuardadas, { codigo: siguiente.codigo, cantidad: Math.max(0, g.n - g.unidades) }])}>+ Agregar juguete</button>
          : <span />}
        {g.filasPlan.length > 0 && (
          <span className={falta > 0 ? 'neg' : falta < 0 ? 'warn' : 'pos'}>
            {fmtNum(g.unidades)} para {fmtNum(g.n)}{falta > 0 ? `: faltan ${fmtNum(falta)}` : falta < 0 ? `: sobran ${fmtNum(-falta)}` : ': completo'}, {fmtCOP(g.costo)}
          </span>
        )}
      </div>
    </div>
  );
}

/* ---------- Piezas pequeñas ---------- */
function Marca({ sub }) {
  const [ok, setOk] = useState(true);
  return (
    <div className="brand">
      {ok && <img src={CONFIG.logoUrl} alt="Supertiendas Cañaveral" onError={() => setOk(false)} />}
      <div className="brand-text"><b>Regalos de Navidad {CONFIG.anio}</b><span title={sub}>{sub || 'Gestión Humana'}</span></div>
    </div>
  );
}
function Seccion({ titulo, texto, children }) {
  return (<><div className="page-head"><div><h1>{titulo}</h1><p>{texto}</p></div></div>{children}</>);
}
function Ocupado({ texto }) { return <div className="busy" role="status"><div><div className="spinner" />{texto}</div></div>; }
function Modal({ titulo, texto, onCerrar, children }) {
  useEffect(() => { const h = (e) => e.key === 'Escape' && onCerrar(); window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h); }, [onCerrar]);
  return (
    <div className="backdrop" onMouseDown={(e) => { if (e.target === e.currentTarget) onCerrar(); }}>
      <div className="modal" role="dialog" aria-modal="true" aria-label={titulo}>
        <h2>{titulo}</h2>{texto && <p>{texto}</p>}{children}
      </div>
    </div>
  );
}
function ModalDecisionMasiva({ ks, d, limpiar, revisor, onCancelar, onGuardar }) {
  const [dec, setDec] = useState(d || 'OK');
  const [motivo, setMotivo] = useState('');
  const [por, setPor] = useState(revisor || '');
  const puede = por.trim() && (dec === 'OK' || motivo.trim());
  const yaRevisados = ks.filter((k) => k.decision).length;
  const muestra = ks.slice(0, 6).map((k) => k.nino || 'Sin nombre').join(', ') + (ks.length > 6 ? ` y ${fmtNum(ks.length - 6)} más` : '');
  return (
    <Modal titulo={`Revisar ${plural(ks.length, 'niño', 'niños')} a la vez`} texto={muestra} onCerrar={onCancelar}>
      <div className="form-row">
        <span className="lbl">Decisión para todos</span>
        <div className="segmented" role="group">
          <button aria-pressed={dec === 'OK'} onClick={() => setDec('OK')}>Aprobar</button>
          <button aria-pressed={dec === 'NO'} onClick={() => setDec('NO')}>No aprobar</button>
        </div>
      </div>
      {yaRevisados > 0 && <div className="alert alert-warn">{plural(yaRevisados, 'ya tenía revisión', 'ya tenían revisión')}: se reemplaza por esta.</div>}
      <div className="form-row">
        <label htmlFor="motivo-m">Motivo{dec === 'NO' ? '' : ' (opcional)'}</label>
        <input id="motivo-m" type="text" value={motivo} onChange={(e) => setMotivo(e.target.value)} maxLength={200} placeholder={dec === 'OK' ? 'Ej: documentos verificados con talento humano' : 'Ej: no cumplen los requisitos'} autoFocus />
      </div>
      <div className="form-row">
        <label htmlFor="por-m">Tu nombre</label>
        <input id="por-m" type="text" value={por} onChange={(e) => setPor(e.target.value)} maxLength={60} placeholder="Quién revisa" />
      </div>
      <div className="modal-actions">
        <button className="btn" onClick={onCancelar}>Cancelar</button>
        <button className="btn btn-primary" disabled={!puede} onClick={() => onGuardar(ks, dec, motivo, por, limpiar)}>{dec === 'OK' ? `Aprobar ${fmtNum(ks.length)}` : `No aprobar ${fmtNum(ks.length)}`}</button>
      </div>
    </Modal>
  );
}
function ModalDecision({ k, d, revisor, onCancelar, onGuardar }) {
  const [dec, setDec] = useState(d || k.decision?.d || 'OK');
  const [motivo, setMotivo] = useState(k.decision?.motivo || '');
  const [por, setPor] = useState(revisor || '');
  const [asignarA, setAsignarA] = useState(k.decision?.asignarA || '');
  const cedOriginal = k.key.split('|')[0];
  const puede = por.trim() && (dec === 'OK' || motivo.trim());
  return (
    <Modal titulo={k.nino || 'Niño sin nombre'} texto={`Inscrito con la cédula ${cedOriginal}${k.reasignadoDe ? ` (${k.reasignadoDe})` : ` por ${k.colaborador}`}. Documento del niño: ${k.doc || 'sin documento'}.`} onCerrar={onCancelar}>
      <div className="form-row">
        <span className="lbl">Decisión</span>
        <div className="segmented" role="group">
          <button aria-pressed={dec === 'OK'} onClick={() => setDec('OK')}>Aprobar</button>
          <button aria-pressed={dec === 'NO'} onClick={() => setDec('NO')}>No aprobar</button>
        </div>
      </div>
      {dec === 'OK' && k.candidatos?.length > 0 && (
        <div className="form-row">
          <label htmlFor="asignar">Entregar a nombre de</label>
          <select id="asignar" value={asignarA} onChange={(e) => setAsignarA(e.target.value)}>
            <option value="">Dejarlo como está (CC {cedOriginal})</option>
            {k.candidatos.map((c) => <option key={c.ced} value={c.ced}>CC {c.ced}, {c.nombre} ({c.sede})</option>)}
          </select>
          <p className="hint">Si en el Forms pusieron mal la cédula, escoge a la persona correcta del maestro: el niño sale en su sede y en su planilla.</p>
        </div>
      )}
      <div className="form-row">
        <label htmlFor="motivo">Motivo{dec === 'NO' ? '' : ' (opcional)'}</label>
        <input id="motivo" type="text" value={motivo} onChange={(e) => setMotivo(e.target.value)} maxLength={200} placeholder={dec === 'OK' ? 'Ej: se llamó al líder y confirmó el documento' : 'Ej: el documento no corresponde a un hijo'} autoFocus />
      </div>
      <div className="form-row">
        <label htmlFor="por">Tu nombre</label>
        <input id="por" type="text" value={por} onChange={(e) => setPor(e.target.value)} maxLength={60} placeholder="Quién revisa" />
      </div>
      <div className="modal-actions">
        {k.decision && <button className="btn btn-ghost" onClick={() => onGuardar(k, null, '', por || revisor || '')}>Quitar revisión</button>}
        <span className="spacer" />
        <button className="btn" onClick={onCancelar}>Cancelar</button>
        <button className="btn btn-primary" disabled={!puede} onClick={() => onGuardar(k, dec, motivo, por, asignarA)}>Guardar revisión</button>
      </div>
    </Modal>
  );
}
function ModalClaveGuardar({ onCancelar, onGuardar }) {
  const [c1, setC1] = useState(''); const [c2, setC2] = useState(''); const [sin, setSin] = useState(false);
  const corta = !sin && c1.length > 0 && c1.length < 10;
  const distinta = !sin && c2.length > 0 && c1 !== c2;
  const puede = sin || (c1.length >= 10 && c1 === c2);
  return (
    <Modal titulo="Descargar revisiones" texto="El archivo trae documentos y nombres de niños. Ponle una clave que solo conozcan ustedes; sin ella no se puede abrir." onCerrar={onCancelar}>
      {!sin && <>
        <div className="form-row"><label htmlFor="c1">Clave (mínimo 10 caracteres)</label><input id="c1" type="password" value={c1} onChange={(e) => setC1(e.target.value)} autoFocus autoComplete="new-password" />{corta && <p className="hint" style={{ color: 'var(--bad)' }}>Muy corta.</p>}</div>
        <div className="form-row"><label htmlFor="c2">Repite la clave</label><input id="c2" type="password" value={c2} onChange={(e) => setC2(e.target.value)} autoComplete="new-password" />{distinta && <p className="hint" style={{ color: 'var(--bad)' }}>No coincide.</p>}</div>
      </>}
      <label className="check" style={{ padding: '4px 0 12px' }}><input type="checkbox" checked={sin} onChange={(e) => setSin(e.target.checked)} /><span>Descargar sin clave<small>Cualquiera que tenga el archivo podrá leerlo.</small></span></label>
      <div className="modal-actions"><button className="btn" onClick={onCancelar}>Cancelar</button><button className="btn btn-primary" disabled={!puede} onClick={() => onGuardar(sin ? '' : c1)}>Descargar</button></div>
    </Modal>
  );
}
function ModalClaveAbrir({ mala, onCancelar, onAbrir }) {
  const [c, setC] = useState('');
  return (
    <Modal titulo="Este archivo tiene clave" texto="Escribe la clave que acordaron para las revisiones." onCerrar={onCancelar}>
      <div className="form-row"><label htmlFor="ca">Clave</label><input id="ca" type="password" value={c} onChange={(e) => setC(e.target.value)} autoFocus onKeyDown={(e) => e.key === 'Enter' && c && onAbrir(c)} />{mala && <p className="hint" style={{ color: 'var(--bad)' }}>La clave no es correcta. Intenta de nuevo.</p>}</div>
      <div className="modal-actions"><button className="btn" onClick={onCancelar}>Cancelar</button><button className="btn btn-primary" disabled={!c} onClick={() => onAbrir(c)}>Abrir</button></div>
    </Modal>
  );
}
function haceCuanto(iso) {
  if (!iso) return '';
  const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 10) return 'ahora';
  if (s < 60) return `hace ${s} s`;
  if (s < 3600) return `hace ${Math.round(s / 60)} min`;
  return new Date(iso).toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function EstadoGuardado({ local, nube, gh, onGithub, onSubir }) {
  const [, tic] = useState(0);
  useEffect(() => { const t = setInterval(() => tic((n) => n + 1), 20000); return () => clearInterval(t); }, []);
  const n = nube.estado;
  return (
    <div className="guardado">
      <div className="guardado-fila">
        <span className={`dot-estado ${local === 'error' ? 'mal' : 'bien'}`} />
        <span>{local === 'error' ? 'No se pudo guardar en este equipo (¿ventana privada?)' : 'Guardado en este equipo'}</span>
      </div>
      <div className="guardado-fila">
        <span className={`dot-estado ${n === 'ok' ? 'bien' : n === 'error' ? 'mal' : n === 'off' ? 'apagado' : 'espera'}`} />
        <span>
          {n === 'off' && 'Copia en GitHub: sin conectar'}
          {n === 'falta-clave' && 'Copia en GitHub: falta la clave'}
          {n === 'pendiente' && 'Copia en GitHub: hay cambios por subir…'}
          {n === 'subiendo' && 'Copia en GitHub: sincronizando…'}
          {n === 'ok' && `Copia en GitHub: al día${nube.fecha ? ' · ' + haceCuanto(nube.fecha) : ''}`}
          {n === 'error' && <>Copia en GitHub: error<small className="guardado-error">{nube.msg}</small></>}
        </span>
      </div>
      <div className="row">
        <button className="btn btn-sm" onClick={onGithub}>{gh.token ? (n === 'falta-clave' ? 'Escribir clave' : 'GitHub…') : 'Conectar GitHub'}</button>
        {(n === 'error' || n === 'pendiente') && <button className="btn btn-sm btn-primary" onClick={onSubir}>Subir ahora</button>}
      </div>
    </div>
  );
}
function ModalMaestro({ onCerrar, onArchivos, total }) {
  const [modo, setModo] = useState('agregar');
  return (
    <Modal titulo="Actualizar maestro de personal" texto={`Sube el Excel del maestro nuevo. Las respuestas del Forms y las revisiones no se tocan.${total ? ` Hoy hay ${fmtNum(total)} personas en el maestro.` : ''}`} onCerrar={onCerrar}>
      <div className="checks" role="radiogroup" aria-label="Cómo actualizar">
        <label className="check"><input type="radio" name="modo-maestro" checked={modo === 'agregar'} onChange={() => setModo('agregar')} /><span>Agregar y actualizar personas<small>Suma las personas nuevas y actualiza los datos de las que ya estaban. No se borra a nadie. Sirve si el archivo trae solo los ingresos nuevos.</small></span></label>
        <label className="check"><input type="radio" name="modo-maestro" checked={modo === 'reemplazar'} onChange={() => setModo('reemplazar')} /><span>Reemplazar el maestro completo<small>Usa este archivo como el maestro nuevo. Quien no esté en él queda como “no está en el maestro”.</small></span></label>
      </div>
      <ZonaArchivo compacta onArchivos={(f) => onArchivos(f, modo)}><b>Arrastra aquí el maestro</b><span>o haz clic para escogerlo</span></ZonaArchivo>
      <div className="modal-actions" style={{ marginTop: 14 }}><button className="btn" onClick={onCerrar}>Cancelar</button></div>
    </Modal>
  );
}
function ModalMaestroOk({ r, onCerrar, onVer }) {
  const resueltos = r.fueraAntes != null && r.fueraDespues != null ? r.fueraAntes - r.fueraDespues : null;
  return (
    <Modal titulo="Maestro actualizado" texto={`Ahora hay ${plural(r.total, 'persona', 'personas')} en el maestro (${fmtNum(r.activos)} activas).`} onCerrar={onCerrar}>
      <ul className="reasons" style={{ margin: '0 0 14px' }}>
        <li>{plural(r.nuevas, 'persona nueva', 'personas nuevas')}</li>
        <li>{plural(r.actualizadas, 'persona con datos actualizados', 'personas con datos actualizados')}</li>
        {r.modo === 'reemplazar' && <li>{plural(r.quitadas, 'persona ya no está', 'personas ya no están')} en el maestro</li>}
        {resueltos != null && resueltos > 0 && <li><b>{plural(resueltos, 'niño que no estaba en el maestro ahora sí está', 'niños que no estaban en el maestro ahora sí están')}</b></li>}
        {r.fueraDespues != null && <li>{r.fueraDespues ? `${r.fueraDespues === 1 ? 'Queda' : 'Quedan'} ${plural(r.fueraDespues, 'niño', 'niños')} con cédula que no está en el maestro` : 'Ya no queda ningún niño fuera del maestro'}</li>}
      </ul>
      <div className="modal-actions">
        {r.fueraDespues ? <button className="btn" onClick={onVer}>Ver los que no están</button> : null}
        <button className="btn btn-primary" onClick={onCerrar}>Listo</button>
      </div>
    </Modal>
  );
}
function AbrirConClave({ onAbrir }) {
  const [c, setC] = useState('');
  const [err, setErr] = useState('');
  const [abriendo, setAbriendo] = useState(false);
  const abrir = async () => {
    setErr(''); setAbriendo(true);
    try { await onAbrir(c); } catch (e) { setErr(e.claveMala ? 'La clave no es correcta.' : (e.message || String(e))); }
    setAbriendo(false);
  };
  return (
    <div className="hero-nube hero-clave">
      <b>Abrir lo que ya trabajó el equipo</b>
      <p className="sub">Escribe la clave del equipo y la página trae el Excel, las revisiones y el presupuesto. Para que los cambios de este computador también suban a GitHub, después pega el token en «Conectar GitHub».</p>
      <div className="row" style={{ display: 'flex', gap: 8 }}>
        <input type="password" value={c} onChange={(e) => setC(e.target.value)} placeholder="Clave del equipo" aria-label="Clave del equipo" autoComplete="current-password"
          onKeyDown={(e) => e.key === 'Enter' && c && !abriendo && abrir()} style={{ flex: 1, minWidth: 0 }} />
        <button className="btn btn-primary btn-sm" disabled={!c || abriendo} onClick={abrir}>{abriendo ? 'Abriendo…' : 'Abrir'}</button>
      </div>
      {err && <p className="sub" style={{ color: 'var(--bad)' }} role="alert">{err}</p>}
    </div>
  );
}
function ModalGithub({ gh, clave, onCancelar, onGuardar, onDesconectar, onBorrar }) {
  const [cfg, setCfg] = useState({ ...gh });
  const [c1, setC1] = useState(clave || '');
  const [probando, setProbando] = useState(false);
  const [err, setErr] = useState('');
  const cambiar = (k) => (e) => setCfg((x) => ({ ...x, [k]: e.target.type === 'checkbox' ? e.target.checked : e.target.value }));
  const puede = cfg.token.trim() && /^[^/\s]+\/[^/\s]+$/.test(cfg.repo.trim()) && cfg.rama.trim() && cfg.ruta.trim() && c1.length >= 10;
  const probar = async () => {
    setErr(''); setProbando(true);
    try {
      const remota = await ghLeer(cfg);
      if (remota) await abrirJsonRevisiones(remota.texto, c1); // revisa que la clave sea la misma de la copia
      onGuardar({ ...cfg, token: cfg.token.trim(), repo: cfg.repo.trim(), rama: cfg.rama.trim(), ruta: cfg.ruta.trim() }, c1);
    } catch (e) {
      setErr(e.claveMala ? 'La clave no es la misma con la que se guardó la copia que ya está en GitHub.' : (e.message || String(e)));
    }
    setProbando(false);
  };
  return (
    <Modal titulo="Copia en GitHub" texto="La página sube sola una copia cifrada después de cada cambio, y trae lo que suban los demás. Todos deben usar el mismo repositorio, rama, archivo y clave." onCerrar={onCancelar}>
      <div className="form-row"><label htmlFor="gh-t">Token de GitHub</label><input id="gh-t" type="password" value={cfg.token} onChange={cambiar('token')} autoComplete="off" placeholder="github_pat_…" />
        <p className="hint">Créalo en GitHub → Settings → Developer settings → Fine-grained tokens. Solo el repositorio {cfg.repo || 'del respaldo'}, permiso <b>Contents: Read and write</b>. Se guarda solo en este equipo.</p></div>
      <div className="form-row"><label htmlFor="gh-r">Repositorio (dueño/nombre)</label><input id="gh-r" value={cfg.repo} onChange={cambiar('repo')} autoComplete="off" /></div>
      <div className="form-row"><label htmlFor="gh-b">Rama</label><input id="gh-b" value={cfg.rama} onChange={cambiar('rama')} autoComplete="off" /></div>
      <div className="form-row"><label htmlFor="gh-p">Archivo</label><input id="gh-p" value={cfg.ruta} onChange={cambiar('ruta')} autoComplete="off" /></div>
      <div className="form-row"><label htmlFor="gh-c">Clave del equipo (mínimo 10 caracteres)</label><input id="gh-c" type="password" value={c1} onChange={(e) => setC1(e.target.value)} autoComplete="new-password" />
        <p className="hint">Sin esta clave nadie puede leer la copia. Si se pierde, la copia no se puede abrir: guárdenla en un lugar seguro.</p></div>
      <label className="check" style={{ padding: '4px 0 12px' }}><input type="checkbox" checked={!!cfg.recordarClave} onChange={cambiar('recordarClave')} /><span>Recordar la clave en este equipo<small>Así no hay que escribirla cada vez. Úsalo solo en tu computador.</small></span></label>
      {err && <div className="alert alert-bad" role="alert">{err}</div>}
      <div className="modal-actions" style={{ flexWrap: 'wrap' }}>
        {gh.token && <button className="btn" onClick={onDesconectar}>Desconectar</button>}
        <button className="btn" onClick={onBorrar}>Borrar datos de este equipo</button>
        <span style={{ flex: 1 }} />
        <button className="btn" onClick={onCancelar}>Cancelar</button>
        <button className="btn btn-primary" disabled={!puede || probando} onClick={probar}>{probando ? 'Conectando…' : 'Conectar'}</button>
      </div>
    </Modal>
  );
}
function DevBar({ valor, onCambio }) {
  return (
    <div className="devbar" role="group" aria-label="Datos de prueba">
      {[['real', 'Datos reales'], ['demo', 'Demo'], ['peor', 'Peor caso'], ['uno', 'Uno'], ['vacio', 'Vacío']].map(([v, t]) => (
        <button key={v} aria-pressed={valor === v} onClick={() => onCambio(v)}>{t}</button>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
